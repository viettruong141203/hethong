<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tra Cứu Hình Ảnh Bằng ID</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #3b82f6;
            --success-bg: #d1fae5;
            --success-text: #065f46;
            --error-bg: #fee2e2;
            --error-text: #991b1b;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --border: #e5e7eb;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 600px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        h2 {
            margin-top: 0;
            margin-bottom: 25px;
            font-size: 22px;
            text-align: center;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        .input-group label {
            font-weight: 600;
            color: var(--text-main);
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            font-size: 15px;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        button {
            padding: 12px 16px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #2563eb;
        }

        #loadingText {
            text-align: center;
            font-weight: 500;
            color: var(--primary);
            padding: 15px;
            background-color: #eff6ff;
            border-radius: 8px;
            border: 1px dashed var(--primary);
            margin-bottom: 20px;
        }

        #result {
            padding: 15px;
            border-radius: 8px;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        #result.success { background-color: var(--success-bg); color: var(--success-text); border: 1px solid #a7f3d0; }
        #result.error { background-color: var(--error-bg); color: var(--error-text); border: 1px solid #fecaca; }
        
        .media-wrapper {
            width: 100%;
            text-align: center;
            border-top: 1px solid var(--border);
            padding-top: 20px;
        }

        img {
            max-width: 100%;
            max-height: 50vh;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Tra Cứu Dữ Liệu & Hình Ảnh</h2>

    <!-- Các phần tử ẩn để tương thích hoàn toàn với upload.js -->
    <div style="display: none;">
        <input type="file" id="fileInput">
        <button id="uploadBtn"></button>
        <button id="fetchBtn"></button>
    </div>

    <!-- Cột nhập ID -->
    <div class="input-group">
        <label for="searchId">Mã ID Hình ảnh / Video:</label>
        <input type="text" id="searchId" placeholder="Dán ID từ Google Drive vào đây...">
        <!-- Nút gọi hàm kết hợp -->
        <button id="checkBtn" onclick="viewDataAndImage()">Lấy Dữ Liệu & Xem Ảnh</button>
    </div>

    <!-- Nơi hiển thị trạng thái và Text từ file JS -->
    <div id="loadingText" style="display: none;"></div>
    <div id="result" style="display: none;"></div>

    <!-- Nơi hiển thị Hình Ảnh -->
    <div class="media-wrapper" id="mediaWrapper" style="display: none;">
        <img id="displayImage" alt="Hình ảnh xem trước">
    </div>
</div>

<!-- Tải mã JS của bạn từ GitHub -->
<script src="https://viettruong141203.github.io/hethong/Bot/upload.js"></script>

<!-- Script xử lý hiển thị ảnh song song với việc lấy dữ liệu -->
<script>
    function viewDataAndImage() {
        const fileId = document.getElementById('searchId').value.trim();
        const mediaWrapper = document.getElementById('mediaWrapper');
        const displayImage = document.getElementById('displayImage');

        if (!fileId) {
            alert("Vui lòng nhập ID cần tra cứu!");
            return;
        }

        // 1. Gọi hàm checkDataById() có sẵn trong upload.js để lấy text
        if (typeof checkDataById === 'function') {
            checkDataById();
        }

        // 2. Tự động tạo link nhúng từ ID và hiển thị ảnh bên dưới
        displayImage.src = 'https://drive.google.com/uc?export=view&id=' + fileId;
        mediaWrapper.style.display = 'block';
    }
</script>

</body>
</html>
