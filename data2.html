<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trình Xem Dữ Liệu Toàn Màn Hình</title>
    <style>
        /* Xóa viền, làm nền đen toàn màn hình */
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #000; color: #fff;
            font-family: Arial, sans-serif; overflow: hidden;
            display: flex; justify-content: center; align-items: center;
        }

        /* 🔒 QUAN TRỌNG: Ép ẩn tuyệt đối mọi thứ của file upload.js */
        #hidden-upload-ui, #result, #loadingText {
            display: none !important;
            position: absolute;
            left: -9999px;
            opacity: 0;
            pointer-events: none;
        }

        /* Khung thông báo trạng thái của trang này */
        #statusViewer {
            position: absolute; z-index: 10;
            background: rgba(31, 41, 55, 0.9);
            padding: 15px 25px; border-radius: 8px;
            font-size: 16px; font-weight: bold;
        }

        /* Khung phát iframe toàn màn hình */
        iframe {
            width: 100vw; height: 100vh; border: none;
            display: none; /* Ẩn cho đến khi có dữ liệu */
        }
    </style>
</head>
<body>

    <!-- KHU VỰC ẨN: Chứa các ID mồi cho file upload.js hoạt động mà không gây lỗi giao diện -->
    <div id="hidden-upload-ui">
        <input type="text" id="searchId">
        <input type="file" id="fileInput">
        <button id="uploadBtn"></button>
        <button id="fetchBtn"></button>
        <button id="checkBtn"></button>
        <div id="loadingText"></div>
        <div id="result"></div>
    </div>

    <!-- Thông báo hiển thị cho người dùng -->
    <div id="statusViewer">⏳ Đang kết nối dữ liệu, vui lòng chờ...</div>

    <!-- Khung xem chính -->
    <iframe id="displayFrame" allow="autoplay; fullscreen" allowfullscreen="true" webkitallowfullscreen="true" mozallowfullscreen="true"></iframe>

    <!-- Import file JS gốc của bạn -->
    <script src="https://viettruong141203.github.io/hethong/Bot/upload.js"></script>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const fileId = urlParams.get('id');
            const statusViewer = document.getElementById('statusViewer');

            if (!fileId) {
                statusViewer.innerHTML = "⚠️ Lỗi: Thiếu ID.<br>Vui lòng thêm ?id=MÃ_FILE vào URL.";
                return;
            }

            // Gọi hàm từ upload.js
            document.getElementById('searchId').value = fileId;
            if (typeof checkDataById === 'function') {
                checkDataById();
            }

            // Theo dõi kết quả ngầm
            const resultDiv = document.getElementById('result');
            const displayFrame = document.getElementById('displayFrame');

            const observer = new MutationObserver((mutationsList, observer) => {
                if (resultDiv.classList.contains('success')) {
                    const linkElement = resultDiv.querySelector('a');
                    
                    if (linkElement && linkElement.href) {
                        const originalUrl = linkElement.href;
                        let realDriveId = null;
                        
                        // Regex trích xuất ID Drive
                        let match = originalUrl.match(/\/d\/([a-zA-Z0-9_-]+)/);
                        if (match) {
                            realDriveId = match[1];
                        } else {
                            match = originalUrl.match(/id=([a-zA-Z0-9_-]+)/);
                            if (match) realDriveId = match[1];
                        }

                        if (realDriveId) {
                            // Dùng /preview để Google Drive tự động render Ảnh hoặc Video an toàn nhất
                            displayFrame.src = `https://drive.google.com/file/d/${realDriveId}/preview`;
                            displayFrame.style.display = "block";
                            statusViewer.style.display = "none"; // Ẩn thông báo khi load xong
                            observer.disconnect(); 
                        } else {
                            statusViewer.innerHTML = "⚠️ Lỗi: Không thể trích xuất ID Google Drive hợp lệ.";
                            observer.disconnect();
                        }
                    }
                } else if (resultDiv.classList.contains('error')) {
                    statusViewer.innerHTML = "❌ Lỗi: Không tìm thấy file này trên hệ thống.";
                    observer.disconnect();
                }
            });

            // Quan sát sự thay đổi trong thẻ ẩn
            observer.observe(resultDiv, { attributes: true, childList: true, subtree: true });
        });
    </script>
</body>
</html>
