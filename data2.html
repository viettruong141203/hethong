<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trình Phát Video Cao Cấp</title>
    
    <!-- Tích hợp CSS của Plyr Player -->
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    
    <style>
        /* Nền rạp chiếu phim (Theater Mode) */
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #0f0f0f; color: #fff;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            display: flex; justify-content: center; align-items: center;
        }

        /* 🔒 Ép ẩn tuyệt đối UI của upload.js để không bị vỡ giao diện */
        #hidden-upload-ui, #result, #loadingText {
            display: none !important; position: absolute; left: -9999px;
        }

        /* Khung trạng thái */
        #statusViewer {
            position: absolute; z-index: 10;
            background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px);
            padding: 15px 25px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2);
            font-size: 16px; font-weight: 500;
            text-align: center;
        }

        /* Container chứa Media */
        .media-container {
            width: 100%; max-width: 1000px; /* Độ rộng rạp chiếu */
            border-radius: 12px; overflow: hidden;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            display: none; /* Ẩn đến khi có dữ liệu */
            background: #000;
        }

        /* Tùy chỉnh ảnh nếu file là ảnh */
        #displayImage {
            width: 100%; max-height: 85vh; object-fit: contain; display: none;
        }

        /* Nút dự phòng trường hợp Google Drive chặn file nặng */
        .fallback-btn {
            display: block; width: fit-content; margin: 20px auto;
            padding: 10px 20px; background: #3b82f6; color: white;
            text-decoration: none; border-radius: 6px; font-weight: bold;
        }
        .fallback-btn:hover { background: #2563eb; }
    </style>
</head>
<body>

    <!-- KHU VỰC ẨN: Chứa các input mồi cho upload.js -->
    <div id="hidden-upload-ui">
        <input type="text" id="searchId">
        <input type="file" id="fileInput">
        <button id="uploadBtn"></button>
        <button id="fetchBtn"></button>
        <button id="checkBtn"></button>
        <div id="loadingText"></div>
        <div id="result"></div>
    </div>

    <!-- Thông báo hiển thị -->
    <div id="statusViewer">
        ⏳ Đang tải dữ liệu media...<br>
        <span style="font-size: 13px; color: #aaa;">(Có thể mất vài giây)</span>
    </div>

    <!-- Khung phát Media (Plyr Video hoặc Ảnh) -->
    <div class="media-container" id="mediaContainer">
        
        <!-- Khung cho Video (Dùng Plyr) -->
        <video id="player" playsinline controls style="display: none;">
            <!-- Source sẽ được JS nạp vào -->
        </video>

        <!-- Khung cho Ảnh -->
        <img id="displayImage" alt="Hình ảnh xem trước">

        <!-- Nút tải/xem gốc hiện ra nếu video bị lỗi (VD file quá 100MB) -->
        <div id="fallbackArea" style="display: none; padding: 20px; text-align: center;">
            <p style="color: #ff4d4d; margin-bottom: 15px;">⚠️ Trình duyệt không thể phát trực tiếp video này do giới hạn của Google Drive (thường do file quá nặng).</p>
            <a href="#" id="fallbackLink" target="_blank" class="fallback-btn">👉 Bấm vào đây để Xem gốc / Tải xuống</a>
        </div>
    </div>

    <!-- 1. Import Thư viện Plyr & JS upload của bạn -->
    <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>
    <script src="https://viettruong141203.github.io/hethong/Bot/upload.js"></script>

    <!-- 2. Script Xử lý logic -->
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const fileId = urlParams.get('id');
            const statusViewer = document.getElementById('statusViewer');

            if (!fileId) {
                statusViewer.innerHTML = "⚠️ Lỗi: Không tìm thấy ID.<br>Ví dụ: ?id=1A2B3C4D";
                return;
            }

            // Kích hoạt hàm upload.js
            document.getElementById('searchId').value = fileId;
            if (typeof checkDataById === 'function') {
                checkDataById();
            }

            const resultDiv = document.getElementById('result');
            const mediaContainer = document.getElementById('mediaContainer');
            const videoElement = document.getElementById('player');
            const imageElement = document.getElementById('displayImage');
            const fallbackArea = document.getElementById('fallbackArea');
            const fallbackLink = document.getElementById('fallbackLink');

            const observer = new MutationObserver((mutationsList, observer) => {
                if (resultDiv.classList.contains('success')) {
                    const linkElement = resultDiv.querySelector('a');
                    const textContent = resultDiv.innerText.toUpperCase();
                    
                    if (linkElement && linkElement.href) {
                        const originalUrl = linkElement.href;
                        let realDriveId = null;
                        
                        let match = originalUrl.match(/\/d\/([a-zA-Z0-9_-]+)/);
                        if (match) realDriveId = match[1];
                        else {
                            match = originalUrl.match(/id=([a-zA-Z0-9_-]+)/);
                            if (match) realDriveId = match[1];
                        }

                        if (realDriveId) {
                            const directLink = `https://drive.google.com/uc?export=download&id=${realDriveId}`;
                            const isVideo = textContent.includes('VIDEO') || textContent.includes('.MP4');

                            mediaContainer.style.display = "block";
                            statusViewer.style.display = "none";
                            
                            // Gắn link dự phòng để người dùng bấm nếu video không chạy
                            fallbackLink.href = originalUrl;

                            if (isVideo) {
                                videoElement.style.display = "block";
                                videoElement.src = directLink;
                                
                                // Khởi tạo giao diện Video Player cao cấp (Plyr)
                                const player = new Plyr('#player', {
                                    controls: ['play-large', 'play', 'progress', 'current-time', 'duration', 'mute', 'volume', 'settings', 'fullscreen'],
                                    settings: ['speed']
                                });

                                // Bắt lỗi nếu Google Drive chặn phát trực tiếp (Màn hình đen / Bể icon)
                                videoElement.addEventListener('error', () => {
                                    document.querySelector('.plyr').style.display = 'none';
                                    fallbackArea.style.display = 'block';
                                });
                            } else {
                                imageElement.style.display = "block";
                                imageElement.src = directLink;

                                imageElement.addEventListener('error', () => {
                                    imageElement.style.display = 'none';
                                    fallbackArea.style.display = 'block';
                                });
                            }
                            observer.disconnect(); 
                        }
                    }
                } else if (resultDiv.classList.contains('error')) {
                    statusViewer.innerHTML = "❌ Lỗi: File không tồn tại hoặc đã bị xóa.";
                    observer.disconnect();
                }
            });

            observer.observe(resultDiv, { attributes: true, childList: true, subtree: true });
        });
    </script>
</body>
</html>
