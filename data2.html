<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trình Xem Cinematic</title>
    <style>
        /* Nền tối phong cách rạp phim */
        body {
            margin: 0; padding: 0; 
            background-color: #050505; color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; overflow: hidden;
        }

        /* 🔒 Vùng ẩn cho upload.js (Không được xóa) */
        #hidden-zone { display: none !important; }

        /* Tiêu đề tùy chỉnh phía trên video */
        .top-bar {
            position: absolute; top: 0; left: 0; right: 0;
            padding: 20px; display: flex; justify-content: space-between;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
            z-index: 10; font-weight: 500;
        }
        
        .file-title { font-size: 18px; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }

        /* Khung chiếu bóng */
        .cinema-screen {
            width: 100%; max-width: 1000px; height: 60vh; min-height: 400px;
            background: #000; border-radius: 12px; overflow: hidden;
            box-shadow: 0 0 50px rgba(255,255,255,0.05);
            display: none; position: relative;
        }

        iframe { width: 100%; height: 100%; border: none; }

        /* Trạng thái Loading */
        #status-msg {
            font-size: 16px; color: #888;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="file-title" id="displayTitle">Đang kết nối...</div>
    </div>

    <div id="status-msg">Đang đồng bộ dữ liệu với Google Drive...</div>

    <div class="cinema-screen" id="cinemaScreen">
        <iframe id="mediaFrame" allow="autoplay; fullscreen"></iframe>
    </div>

    <!-- VÙNG ẨN: Ép chạy upload.js ngầm -->
    <div id="hidden-zone">
        <input type="text" id="searchId">
        <input type="file" id="fileInput">
        <button id="uploadBtn"></button><button id="fetchBtn"></button><button id="checkBtn"></button>
        <div id="loadingText"></div><div id="result"></div>
    </div>

    <script src="https://viettruong141203.github.io/hethong/Bot/upload.js"></script>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const fileId = urlParams.get('id');
            const statusMsg = document.getElementById('status-msg');

            if (!fileId) {
                statusMsg.innerHTML = '⚠️ URL thiếu ID. Vui lòng thêm ?id=...';
                return;
            }

            // Gọi hệ thống của bạn
            document.getElementById('searchId').value = fileId;
            if (typeof checkDataById === 'function') checkDataById();

            const resultDiv = document.getElementById('result');
            const observer = new MutationObserver(() => {
                if (resultDiv.classList.contains('success')) {
                    observer.disconnect();
                    
                    // Lấy link Drive
                    const linkTag = resultDiv.querySelector('a');
                    let realDriveId = null;
                    if (linkTag && linkTag.href) {
                        let match = linkTag.href.match(/\/(?:d|id=)\/([a-zA-Z0-9_-]+)/);
                        if (match) realDriveId = match[1];
                    }

                    if (realDriveId) {
                        // Hiển thị iframe
                        document.getElementById('mediaFrame').src = `https://drive.google.com/file/d/${realDriveId}/preview`;
                        document.getElementById('cinemaScreen').style.display = 'block';
                        statusMsg.style.display = 'none';
                        
                        // Cập nhật tiêu đề ảo (lấy từ dữ liệu trả về)
                        let rawText = resultDiv.innerText;
                        let nameMatch = rawText.match(/Tên file:\s*(.*)/i);
                        if (nameMatch) document.getElementById('displayTitle').innerText = nameMatch[1];
                        else document.getElementById('displayTitle').innerText = "Trình phát Media";
                    } else {
                        statusMsg.innerHTML = '⚠️ Lỗi: Link lưu trong hệ thống không phải ID Drive.';
                    }
                } else if (resultDiv.classList.contains('error')) {
                    observer.disconnect();
                    statusMsg.innerHTML = '❌ Dữ liệu không tồn tại.';
                }
            });
            observer.observe(resultDiv, { attributes: true, childList: true, subtree: true });
        });
    </script>
</body>
</html>
