<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trình Xem Toàn Màn Hình</title>
    <style>
        /* Xóa bỏ mọi khoảng cách, cài đặt nền đen toàn màn hình */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden; /* Ẩn thanh cuộn */
            font-family: Arial, sans-serif;
        }

        /* Giao diện thông báo tải được đặt ở giữa màn hình */
        .message-box {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            background-color: rgba(31, 41, 55, 0.8);
            padding: 20px 30px;
            border-radius: 8px;
            text-align: center;
            font-size: 16px;
            z-index: 10;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        /* Khung hiển thị media tràn viền */
        .media-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: none; /* Ẩn cho đến khi có link */
            z-index: 1;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <!-- Các input ẩn để tương thích 100% với file upload.js -->
    <div style="display: none;">
        <input type="text" id="searchId">
        <input type="file" id="fileInput">
        <button id="uploadBtn"></button>
        <button id="fetchBtn"></button>
        <button id="checkBtn"></button>
    </div>

    <!-- Hộp thoại thông báo trạng thái -->
    <div id="loadingText" class="message-box" style="display: none;"></div>
    
    <!-- Div kết quả ẩn (Chỉ dùng để mượn dữ liệu từ upload.js) -->
    <div id="result" style="display: none;"></div>
    
    <div id="errorHint" class="message-box" style="display: none;">
        ⚠️ Vui lòng thêm tham số <b>?id=MÃ_FILE</b> vào cuối đường dẫn URL.
    </div>

    <!-- Khung xem toàn màn hình -->
    <div class="media-wrapper" id="mediaWrapper">
        <iframe id="displayFrame" allow="autoplay; fullscreen" allowfullscreen="true" webkitallowfullscreen="true" mozallowfullscreen="true"></iframe>
    </div>

    <!-- Import file JS gốc -->
    <script src="https://viettruong141203.github.io/hethong/Bot/upload.js"></script>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const fileId = urlParams.get('id');
            const loadingText = document.getElementById('loadingText');

            if (!fileId) {
                document.getElementById('errorHint').style.display = 'block';
                return;
            }

            // Hiển thị trạng thái đang tải
            loadingText.style.display = 'block';
            loadingText.innerHTML = "⏳ Đang tải dữ liệu media...";

            // Bắt đầu gọi hàm check
            document.getElementById('searchId').value = fileId;
            if (typeof checkDataById === 'function') {
                checkDataById();
            }

            // Theo dõi kết quả trả về từ upload.js
            const resultDiv = document.getElementById('result');
            const mediaWrapper = document.getElementById('mediaWrapper');
            const displayFrame = document.getElementById('displayFrame');

            const observer = new MutationObserver((mutationsList, observer) => {
                if (resultDiv.classList.contains('success')) {
                    const linkElement = resultDiv.querySelector('a');
                    
                    if (linkElement && linkElement.href) {
                        const originalUrl = linkElement.href;
                        
                        let realDriveId = null;
                        let match = originalUrl.match(/\/d\/([a-zA-Z0-9_-]+)/);
                        if (match) {
                            realDriveId = match[1];
                        } else {
                            match = originalUrl.match(/id=([a-zA-Z0-9_-]+)/);
                            if (match) realDriveId = match[1];
                        }

                        if (realDriveId) {
                            // Cấp link cho iframe và hiển thị tràn màn hình
                            displayFrame.src = `https://drive.google.com/file/d/${realDriveId}/preview`;
                            mediaWrapper.style.display = 'block';
                            
                            // Ẩn hộp thoại loading
                            loadingText.style.display = 'none';
                            
                            observer.disconnect(); 
                        } else {
                            loadingText.innerHTML = "⚠️ Không thể hiển thị: File không có ID Drive hợp lệ.";
                            observer.disconnect();
                        }
                    }
                } else if (resultDiv.classList.contains('error')) {
                    loadingText.innerHTML = "❌ Lỗi: Không tìm thấy dữ liệu file này.";
                    observer.disconnect();
                }
            });

            observer.observe(resultDiv, { attributes: true, childList: true, subtree: true });
        });
    </script>

</body>
</html>
