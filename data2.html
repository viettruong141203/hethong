<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trình Xem Dữ Liệu</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f0f2f5;
            --card-bg: #ffffff;
            --text-main: #1c1e21;
            --text-muted: #65676b;
            --primary: #1877f2;
            --border: #e4e6eb;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .viewer-card {
            background: var(--card-bg);
            width: 100%;
            max-width: 800px;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            overflow: hidden;
            display: none; /* Ẩn cho đến khi có dữ liệu */
            flex-direction: column;
        }

        /* Phần thông tin File */
        .file-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .file-info h3 {
            margin: 0 0 5px 0;
            font-size: 18px;
            color: var(--text-main);
            word-break: break-all;
        }

        .file-meta {
            font-size: 14px;
            color: var(--text-muted);
            display: flex;
            gap: 15px;
        }

        .file-meta span {
            display: inline-flex;
            align-items: center;
        }

        .badge {
            background-color: #e7f3ff;
            color: var(--primary);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        /* Khung hiển thị Google Drive */
        .media-frame {
            width: 100%;
            height: 500px;
            background-color: #000;
            position: relative;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Hộp thoại thông báo */
        .status-box {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }

        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px auto;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .btn-download {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 20px;
            background-color: var(--primary);
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 500;
            font-size: 14px;
        }
        .btn-download:hover { background-color: #166fe5; }
    </style>
</head>
<body>

    <!-- Thông báo đang tải hoặc lỗi -->
    <div class="status-box" id="statusBox">
        <div class="loader" id="loader"></div>
        <div id="statusText">Đang tìm kiếm dữ liệu...</div>
    </div>

    <!-- Thẻ giao diện chính (Hiển thị khi thành công) -->
    <div class="viewer-card" id="viewerCard">
        <div class="file-header">
            <div class="file-info">
                <h3 id="uiFileName">Tên file</h3>
                <div class="file-meta">
                    <span id="uiTime">🕒 Thời gian</span>
                    <span id="uiId">🏷️ ID: ...</span>
                </div>
            </div>
            <div class="badge" id="uiCategory">IMAGE</div>
        </div>
        
        <div class="media-frame">
            <iframe id="uiFrame" allow="autoplay" allowfullscreen="true" webkitallowfullscreen="true" mozallowfullscreen="true"></iframe>
        </div>
        
        <!-- Nút dự phòng để mở link gốc nếu iframe bị trình duyệt chặn -->
        <div style="padding: 15px; text-align: center; background: #fafafa; border-top: 1px solid var(--border);">
            <a href="#" id="uiDriveLink" target="_blank" class="btn-download">Mở Link Google Drive Gốc</a>
        </div>
    </div>

    <script>
        // 🔗 THAY LINK GOOGLE APPS SCRIPT CỦA BẠN VÀO ĐÂY
        const WEB_APP_URL = 'https://script.google.com/macros/s/YOUR_SCRIPT_ID/exec';

        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const fileId = urlParams.get('id');
            const statusBox = document.getElementById('statusBox');
            const statusText = document.getElementById('statusText');
            const loader = document.getElementById('loader');
            const viewerCard = document.getElementById('viewerCard');

            if (!fileId) {
                loader.style.display = 'none';
                statusText.innerHTML = "⚠️ <strong>Thiếu ID file.</strong><br><br>Vui lòng truy cập bằng đường link có chứa tham số ID.<br>Ví dụ: <em>?id=123456789</em>";
                return;
            }

            // Gọi API lấy dữ liệu trực tiếp (Không dùng upload.js)
            const payload = {
                action: "check",
                sheet: "",
                id: fileId
            };

            fetch(WEB_APP_URL, { 
                method: "POST", 
                body: JSON.stringify(payload) 
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === "success") {
                    // Trích xuất ID Drive thực từ URL trả về
                    let realDriveId = null;
                    let match = data.data.url.match(/\/d\/([a-zA-Z0-9_-]+)/);
                    if (match) realDriveId = match[1];
                    else {
                        match = data.data.url.match(/id=([a-zA-Z0-9_-]+)/);
                        if (match) realDriveId = match[1];
                    }

                    if (realDriveId) {
                        // 1. Ẩn thông báo trạng thái
                        statusBox.style.display = 'none';
                        
                        // 2. Điền thông tin vào Card
                        document.getElementById('uiFileName').textContent = data.data.fileName;
                        document.getElementById('uiTime').innerHTML = `🕒 ${data.data.time}`;
                        document.getElementById('uiId').innerHTML = `🏷️ ID: ${fileId}`;
                        document.getElementById('uiCategory').textContent = data.data.category;
                        document.getElementById('uiDriveLink').href = data.data.url;

                        // 3. Kích hoạt Iframe Google Drive an toàn
                        document.getElementById('uiFrame').src = `https://drive.google.com/file/d/${realDriveId}/preview`;
                        
                        // 4. Hiển thị Card
                        viewerCard.style.display = 'flex';
                    } else {
                        loader.style.display = 'none';
                        statusText.innerHTML = "⚠️ Lỗi: Link file trong hệ thống không đúng định dạng Google Drive.";
                    }
                } else {
                    loader.style.display = 'none';
                    statusText.innerHTML = `❌ <strong>Không tìm thấy File</strong><br><br>${data.message}`;
                }
            })
            .catch(error => {
                loader.style.display = 'none';
                statusText.innerHTML = "❌ <strong>Lỗi kết nối</strong><br><br>Không thể kết nối đến máy chủ. Vui lòng kiểm tra lại mạng.";
            });
        });
    </script>
</body>
</html>
