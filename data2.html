<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload File (Max 100MB)</title>
    <style>
        :root{--p:#4f46e5;--bg:#f8fafc;--txt:#1e293b;--bd:#cbd5e1}
        body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--txt);margin:0;padding:20px;display:flex;justify-content:center;align-items:center;min-height:100vh}
        .box{background:#fff;padding:30px;border-radius:12px;box-shadow:0 10px 25px -5px rgba(0,0,0,0.1);width:100%;max-width:450px}
        h2{text-align:center;color:var(--p);margin-top:0}
        label{display:block;font-weight:600;margin-bottom:8px;font-size:14px}
        input{width:100%;padding:10px;border:1px solid var(--bd);border-radius:6px;box-sizing:border-box;margin-bottom:15px}
        button{width:100%;padding:12px;color:#fff;background:var(--p);border:none;border-radius:6px;font-weight:600;cursor:pointer}
        button:disabled{background:#94a3b8;cursor:wait}
        #load{text-align:center;color:var(--p);font-weight:500;display:none;margin-top:15px}
        #res{margin-top:15px;padding:15px;border-radius:6px;display:none;font-size:14px;word-break:break-all}
        #res.ok{background:#dcfce7;color:#166534;border:1px solid #bbf7d0}
        #res.err{background:#fee2e2;color:#991b1b;border:1px solid #fecaca}
        .url-box {background: #fff; padding: 10px; border: 1px solid #bbf7d0; border-radius: 4px; margin-top: 10px; user-select: all; cursor: text;}
        
        /* Progress Bar */
        #progressContainer { display: none; margin-top: 15px; }
        .progress-track { background: #e2e8f0; border-radius: 6px; overflow: hidden; height: 22px; width: 100%; }
        #progressBar { background: var(--s, #10b981); width: 0%; height: 100%; transition: width 0.2s ease; }
        #progressText { text-align: center; font-size: 13px; margin-top: 6px; font-weight: bold; color: var(--txt); }
    </style>
</head>
<body>

<div class="box">
    <h2>Lưu File Siêu Tốc & Lấy URL</h2>
    
    <label>Chọn File (Tối đa 100MB):</label>
    <input type="file" id="fIn" accept="image/*,video/*">
    <button id="bUp">🚀 Tải Lên Drive</button>
    
    <div id="load">⏳ Đang khởi tạo kết nối...</div>
    
    <div id="progressContainer">
        <div class="progress-track">
            <div id="progressBar"></div>
        </div>
        <div id="progressText">0% (0.0 MB / 0.0 MB)</div>
    </div>

    <div id="res"></div>
</div>

<script src="Bot/video.js"></script>

</body>
</html>
