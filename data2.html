<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xem Ảnh và Video</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #3b82f6;
            --success-bg: #d1fae5;
            --success-text: #065f46;
            --error-bg: #fee2e2;
            --error-text: #991b1b;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --border: #e5e7eb;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 700px; /* Mở rộng một chút để xem video thoải mái hơn */
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        h2 {
            margin-top: 0;
            margin-bottom: 25px;
            font-size: 22px;
            text-align: center;
        }

        #loadingText {
            text-align: center;
            font-weight: 500;
            color: var(--primary);
            padding: 15px;
            background-color: #eff6ff;
            border-radius: 8px;
            border: 1px dashed var(--primary);
            margin-bottom: 20px;
        }

        #result {
            padding: 15px;
            border-radius: 8px;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        #result.success { background-color: var(--success-bg); color: var(--success-text); border: 1px solid #a7f3d0; }
        #result.error { background-color: var(--error-bg); color: var(--error-text); border: 1px solid #fecaca; }
        
        .media-wrapper {
            width: 100%;
            text-align: center;
            border-top: 1px solid var(--border);
            padding-top: 20px;
            display: none; /* Ẩn cho đến khi có ID */
        }

        /* Tối ưu khung iframe cho cả ảnh và video */
        iframe {
            width: 100%;
            height: 450px;
            border: none;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            background-color: #000; /* Nền đen giúp video nhìn đẹp hơn */
        }
        
        .hint {
            text-align: center;
            color: #6b7280;
            font-size: 14px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Trình Xem Ảnh & Video</h2>

    <!-- Các phần tử ẩn để tương thích hoàn toàn với file upload.js -->
    <div style="display: none;">
        <input type="text" id="searchId">
        <input type="file" id="fileInput">
        <button id="uploadBtn"></button>
        <button id="fetchBtn"></button>
        <button id="checkBtn"></button>
    </div>

    <!-- Nơi hiển thị trạng thái và Text từ file JS -->
    <div id="loadingText" style="display: none;"></div>
    <div id="result" style="display: none;"></div>
    <div id="errorHint" class="hint" style="display: none;">
        Vui lòng thêm tham số <b>?id=MÃ_FILE</b> vào cuối đường dẫn URL.
    </div>

    <!-- Khung hiển thị Ảnh hoặc Video -->
    <div class="media-wrapper" id="mediaWrapper">
        <iframe id="displayFrame" allow="autoplay" allowfullscreen="true" webkitallowfullscreen="true" mozallowfullscreen="true"></iframe>
    </div>
</div>

<!-- Tải mã JS gốc của bạn -->
<script src="https://viettruong141203.github.io/hethong/Bot/upload.js"></script>

<!-- Script xử lý URL và nhúng -->
<script>
    window.addEventListener('DOMContentLoaded', () => {
        // Lấy ID từ URL (VD: domain.com/view.html?id=123abc456def)
        const urlParams = new URLSearchParams(window.location.search);
        const fileId = urlParams.get('id');

        if (fileId) {
            // 1. Điền ID vào ô input ẩn để hàm checkDataById() có thể đọc được
            document.getElementById('searchId').value = fileId;
            
            // 2. Gọi hàm checkDataById() có sẵn trong upload.js
            if (typeof checkDataById === 'function') {
                checkDataById();
            }

            // 3. Sử dụng endpoint /preview của Drive (Hỗ trợ tốt nhất cho cả Ảnh và Video)
            const iframeUrl = `https://drive.google.com/file/d/${fileId}/preview`;
            
            const mediaWrapper = document.getElementById('mediaWrapper');
            const displayFrame = document.getElementById('displayFrame');
            
            displayFrame.src = iframeUrl;
            mediaWrapper.style.display = 'block';
        } else {
            // Hiển thị hướng dẫn nếu truy cập không có ID
            document.getElementById('errorHint').style.display = 'block';
        }
    });
</script>

</body>
</html>
