<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trình Xem Media (Tích hợp upload.js)</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        /* Giao diện nền */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #1f2937;
        }

        /* Khung hiển thị chính */
        .main-container {
            width: 100%;
            max-width: 800px;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            padding: 20px;
            box-sizing: border-box;
            margin: 20px;
        }

        /* 🔒 VÙNG ẨN: Khóa chặt mọi giao diện thừa của upload.js */
        #hidden-zone {
            display: none !important;
            position: absolute;
            width: 0; height: 0; overflow: hidden;
        }

        /* Trạng thái Loading */
        #custom-loading {
            text-align: center; padding: 40px;
            font-size: 16px; color: #3b82f6; font-weight: 500;
        }

        /* Trạng thái Lỗi */
        #custom-error {
            display: none; text-align: center; padding: 20px;
            color: #dc2626; background: #fee2e2;
            border-radius: 8px; font-weight: 500;
        }

        /* Thông tin file (được copy từ kết quả của upload.js) */
        #clean-info {
            display: none; padding: 15px;
            background: #f8fafc; border: 1px solid #e2e8f0;
            border-radius: 8px; margin-bottom: 15px; line-height: 1.6;
        }

        /* Khung phát Ảnh / Video */
        .iframe-container {
            display: none; width: 100%; height: 500px;
            border-radius: 8px; overflow: hidden;
            background: #000; box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        iframe {
            width: 100%; height: 100%; border: none;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <h2 style="margin-top:0; text-align:center;">Trình Xem Dữ Liệu</h2>
        
        <!-- Các trạng thái hiển thị cho người dùng -->
        <div id="custom-loading">⏳ Đang lấy dữ liệu qua hệ thống upload.js...</div>
        <div id="custom-error"></div>
        <div id="clean-info"></div>

        <!-- Khung nhúng Google Drive an toàn -->
        <div class="iframe-container" id="iframe-container">
            <iframe id="media-frame" allow="autoplay; fullscreen" allowfullscreen="true"></iframe>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- KHU VỰC ẨN (Dành riêng cho upload.js chạy ngầm) -->
    <!-- ========================================== -->
    <div id="hidden-zone">
        <input type="text" id="searchId">
        <input type="file" id="fileInput">
        <button id="uploadBtn"></button>
        <button id="fetchBtn"></button>
        <button id="checkBtn"></button>
        <div id="loadingText"></div>
        <div id="result"></div>
    </div>

    <!-- 1. Gọi trực tiếp Script của bạn -->
    <script src="https://viettruong141203.github.io/hethong/Bot/upload.js"></script>

    <!-- 2. Mã xử lý giao diện -->
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const fileId = urlParams.get('id');

            const customLoading = document.getElementById('custom-loading');
            const customError = document.getElementById('custom-error');
            const cleanInfo = document.getElementById('clean-info');
            const iframeContainer = document.getElementById('iframe-container');
            const mediaFrame = document.getElementById('media-frame');

            if (!fileId) {
                customLoading.style.display = 'none';
                customError.style.display = 'block';
                customError.innerHTML = '⚠️ Không tìm thấy ID.<br>Vui lòng gắn tham số vào đuôi URL (VD: ?id=MÃ_CỦA_BẠN)';
                return;
            }

            // Đẩy ID vào ô input ẩn và kích hoạt hàm của upload.js
            document.getElementById('searchId').value = fileId;
            if (typeof checkDataById === 'function') {
                checkDataById();
            } else {
                customLoading.style.display = 'none';
                customError.style.display = 'block';
                customError.innerHTML = '❌ Lỗi: Không thể kết nối với file upload.js';
                return;
            }

            // Lắng nghe kết quả từ thẻ div#result (đang bị ẩn)
            const resultDiv = document.getElementById('result');
            
            const observer = new MutationObserver((mutations) => {
                // Nếu upload.js báo thành công
                if (resultDiv.classList.contains('success')) {
                    observer.disconnect(); // Dừng lắng nghe
                    customLoading.style.display = 'none';

                    // Trích xuất link Drive từ text kết quả của upload.js
                    const linkTag = resultDiv.querySelector('a');
                    if (linkTag && linkTag.href) {
                        const driveUrl = linkTag.href;
                        let realDriveId = null;
                        
                        // Lọc lấy ID gốc
                        let match = driveUrl.match(/\/d\/([a-zA-Z0-9_-]+)/);
                        if (match) realDriveId = match[1];
                        else {
                            match = driveUrl.match(/id=([a-zA-Z0-9_-]+)/);
                            if (match) realDriveId = match[1];
                        }

                        if (realDriveId) {
                            // Copy Text thông tin lên màn hình chính
                            cleanInfo.innerHTML = resultDiv.innerHTML;
                            cleanInfo.style.display = 'block';

                            // Chèn ID gốc vào iframe để Google hiển thị Player
                            mediaFrame.src = `https://drive.google.com/file/d/${realDriveId}/preview`;
                            iframeContainer.style.display = 'block';
                        } else {
                            customError.style.display = 'block';
                            customError.innerHTML = '⚠️ Lỗi: Link file được lưu không đúng định dạng của Google Drive.';
                        }
                    }
                } 
                // Nếu upload.js báo lỗi
                else if (resultDiv.classList.contains('error')) {
                    observer.disconnect();
                    customLoading.style.display = 'none';
                    customError.style.display = 'block';
                    
                    // Copy nguyên văn câu báo lỗi từ upload.js sang UI chính
                    customError.innerHTML = resultDiv.innerHTML; 
                }
            });

            // Quan sát sự thay đổi trong thẻ ẩn
            observer.observe(resultDiv, { attributes: true, childList: true, subtree: true });
        });
    </script>
</body>
</html>
