<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trình Phát Media Cao Cấp</title>
    <style>
        /* Giao diện xem phim tối giản, nền đen tuyệt đối */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Hộp thoại thông báo giữa màn hình */
        .message-box {
            position: absolute;
            color: #fff;
            background-color: rgba(20, 20, 20, 0.9);
            padding: 20px 30px;
            border-radius: 8px;
            text-align: center;
            font-size: 16px;
            z-index: 10;
            border: 1px solid #333;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        /* Khung chứa media HTML5 */
        .media-container {
            width: 100vw;
            height: 100vh;
            display: none;
            justify-content: center;
            align-items: center;
            background-color: #000;
        }

        /* Tùy chỉnh thẻ video và img gốc */
        video, img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain; /* Giữ nguyên tỷ lệ gốc, không bị méo */
            outline: none;
        }

        /* Tùy chỉnh thanh điều khiển video */
        video::-webkit-media-controls-panel {
            background-image: linear-gradient(transparent, rgba(0, 0, 0, 0.7));
        }
    </style>
</head>
<body>

    <!-- Các input ẩn để tương thích 100% với file upload.js -->
    <div style="display: none;">
        <input type="text" id="searchId">
        <input type="file" id="fileInput">
        <button id="uploadBtn"></button>
        <button id="fetchBtn"></button>
        <button id="checkBtn"></button>
    </div>

    <!-- Hộp thoại thông báo trạng thái -->
    <div id="loadingText" class="message-box" style="display: none;"></div>
    
    <!-- Div kết quả ẩn (Chỉ dùng để mượn dữ liệu từ upload.js) -->
    <div id="result" style="display: none;"></div>
    
    <div id="errorHint" class="message-box" style="display: none;">
        ⚠️ Vui lòng thêm tham số <b>?id=MÃ_FILE</b> vào cuối đường dẫn URL.
    </div>

    <!-- Khung xem media bằng thẻ HTML5 nguyên bản -->
    <div class="media-container" id="mediaContainer">
        <!-- Thẻ dùng cho Video -->
        <video id="html5Video" controls autoplay style="display: none;">
            Trình duyệt của bạn không hỗ trợ thẻ video.
        </video>
        <!-- Thẻ dùng cho Ảnh -->
        <img id="html5Image" alt="Hình ảnh" style="display: none;">
    </div>

    <!-- Import file JS gốc -->
    <script src="https://viettruong141203.github.io/hethong/Bot/upload.js"></script>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const fileId = urlParams.get('id');
            const loadingText = document.getElementById('loadingText');

            if (!fileId) {
                document.getElementById('errorHint').style.display = 'block';
                return;
            }

            // Hiển thị trạng thái đang tải
            loadingText.style.display = 'block';
            loadingText.innerHTML = "⏳ Đang kết nối dữ liệu...";

            // Bắt đầu gọi hàm check trong upload.js
            document.getElementById('searchId').value = fileId;
            if (typeof checkDataById === 'function') {
                checkDataById();
            }

            const resultDiv = document.getElementById('result');
            const mediaContainer = document.getElementById('mediaContainer');
            const html5Video = document.getElementById('html5Video');
            const html5Image = document.getElementById('html5Image');

            // Theo dõi kết quả trả về từ upload.js
            const observer = new MutationObserver((mutationsList, observer) => {
                if (resultDiv.classList.contains('success')) {
                    const linkElement = resultDiv.querySelector('a');
                    
                    if (linkElement && linkElement.href) {
                        const originalUrl = linkElement.href;
                        
                        // Lấy ID Drive thực
                        let realDriveId = null;
                        let match = originalUrl.match(/\/d\/([a-zA-Z0-9_-]+)/);
                        if (match) {
                            realDriveId = match[1];
                        } else {
                            match = originalUrl.match(/id=([a-zA-Z0-9_-]+)/);
                            if (match) realDriveId = match[1];
                        }

                        if (realDriveId) {
                            // Tạo link tải trực tiếp (Direct Link) từ Google Drive
                            const directLink = `https://drive.google.com/uc?export=download&id=${realDriveId}`;
                            
                            // Đọc Text để phân biệt đây là Ảnh hay Video
                            const textContent = resultDiv.innerText.toUpperCase();
                            const isVideo = textContent.includes('VIDEO') || textContent.includes('.MP4') || textContent.includes('.MOV');

                            if (isVideo) {
                                // Nếu là Video: Gán link vào thẻ <video>
                                html5Video.src = directLink;
                                html5Video.style.display = 'block';
                            } else {
                                // Nếu là Ảnh: Gán link vào thẻ <img>
                                html5Image.src = directLink;
                                html5Image.style.display = 'block';
                            }

                            // Hiển thị container và ẩn thông báo
                            mediaContainer.style.display = 'flex';
                            loadingText.style.display = 'none';
                            
                            observer.disconnect(); 
                        } else {
                            loadingText.innerHTML = "⚠️ Không thể hiển thị: File không có ID Drive hợp lệ.";
                            observer.disconnect();
                        }
                    }
                } else if (resultDiv.classList.contains('error')) {
                    loadingText.innerHTML = "❌ Lỗi: Không tìm thấy dữ liệu file này.";
                    observer.disconnect();
                }
            });

            observer.observe(resultDiv, { attributes: true, childList: true, subtree: true });
        });
    </script>

</body>
</html>
