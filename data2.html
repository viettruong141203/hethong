<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trình Xem Ảnh & Video</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #3b82f6;
            --success-bg: #d1fae5;
            --success-text: #065f46;
            --error-bg: #fee2e2;
            --error-text: #991b1b;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --border: #e5e7eb;
        }

        body { font-family: 'Inter', sans-serif; background-color: var(--bg-color); color: var(--text-main); margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { background-color: var(--card-bg); width: 100%; max-width: 700px; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        h2 { margin-top: 0; margin-bottom: 25px; font-size: 22px; text-align: center; }
        #loadingText { text-align: center; font-weight: 500; color: var(--primary); padding: 15px; background-color: #eff6ff; border-radius: 8px; border: 1px dashed var(--primary); margin-bottom: 20px; }
        #result { padding: 15px; border-radius: 8px; line-height: 1.6; margin-bottom: 20px; }
        #result.success { background-color: var(--success-bg); color: var(--success-text); border: 1px solid #a7f3d0; }
        #result.error { background-color: var(--error-bg); color: var(--error-text); border: 1px solid #fecaca; }
        .media-wrapper { width: 100%; text-align: center; display: none; }
        iframe { width: 100%; height: 450px; border: none; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.15); background-color: #000; }
        a { color: var(--primary); text-decoration: none; font-weight: 500; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="container">
    <h2>Trình Xem Ảnh & Video</h2>
    
    <div id="loadingText" style="display: none;"></div>
    <div id="result" style="display: none;"></div>
    <div id="errorHint" style="display: none; text-align: center; color: #6b7280; font-size: 14px;">
        Vui lòng thêm tham số <b>?id=MÃ_FILE</b> vào cuối đường dẫn URL.
    </div>

    <!-- Khung hiển thị -->
    <div class="media-wrapper" id="mediaWrapper">
        <iframe id="displayFrame" allow="autoplay" allowfullscreen="true" webkitallowfullscreen="true" mozallowfullscreen="true"></iframe>
    </div>
</div>

<script>
    // BƯỚC 1: Dán link Web App của bạn vào đây
    const WEB_APP_URL = 'https://script.google.com/macros/s/YOUR_SCRIPT_ID/exec';

    // Hàm lấy ID thực của Google Drive từ link URL bất kỳ
    function extractDriveId(url) {
        let match = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
        if (match) return match[1];
        match = url.match(/id=([a-zA-Z0-9_-]+)/);
        if (match) return match[1];
        return null; 
    }

    window.addEventListener('DOMContentLoaded', () => {
        const urlParams = new URLSearchParams(window.location.search);
        const searchId = urlParams.get('id');
        
        const loadingText = document.getElementById('loadingText');
        const resultDiv = document.getElementById('result');
        const mediaWrapper = document.getElementById('mediaWrapper');
        const displayFrame = document.getElementById('displayFrame');

        if (!searchId) {
            document.getElementById('errorHint').style.display = 'block';
            return;
        }

        // Bắt đầu Fetch dữ liệu
        loadingText.textContent = "⏳ Đang tra cứu dữ liệu...";
        loadingText.style.display = 'block';

        const payload = { action: "check", sheet: "", id: searchId };

        fetch(WEB_APP_URL, { 
            method: "POST", 
            body: JSON.stringify(payload) 
        })
        .then(res => res.json())
        .then(data => {
            loadingText.style.display = 'none';
            resultDiv.style.display = 'block';

            if (data.status === "success") {
                // Hiển thị thông tin
                resultDiv.className = "success";
                resultDiv.innerHTML = `
                    <strong>✅ Đã tìm thấy File!</strong><br>
                    - Phân loại: ${data.data.category}<br>
                    - Mã ID (Sheet): ${searchId}<br>
                    - Tên file: ${data.data.fileName}<br>
                    - Thời gian: ${data.data.time}<br>
                    - Link truy cập: <a href="${data.data.url}" target="_blank">Mở File Gốc</a>
                `;

                // Trích xuất ID Drive thực tế từ Link được trả về
                const realDriveId = extractDriveId(data.data.url);

                if (realDriveId) {
                    // Nhúng bằng ID thực tế của Google Drive
                    displayFrame.src = `https://drive.google.com/file/d/${realDriveId}/preview`;
                    mediaWrapper.style.display = 'block';
                } else {
                    resultDiv.innerHTML += `<br><em>⚠️ Không thể nhúng: Link file không đúng định dạng Drive chuẩn.</em>`;
                }

            } else {
                resultDiv.className = "error";
                resultDiv.innerHTML = `<strong>❌ Không tìm thấy:</strong> ${data.message}`;
            }
        })
        .catch(err => {
            loadingText.style.display = 'none';
            resultDiv.style.display = 'block';
            resultDiv.className = "error";
            resultDiv.innerHTML = `<strong>❌ Lỗi kết nối mạng.</strong>`;
        });
    });
</script>

</body>
</html>
