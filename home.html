<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Trang Chủ - Hệ Thống Trình Duyệt</title>
  <style>
    :root { --bg-glass: rgba(18, 20, 26, 0.95); --border-glass: rgba(255, 255, 255, 0.08); --primary: #3b82f6; --danger: #ef4444; --text-main: #f3f4f6; --text-muted: #9ca3af; --shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.5); }
    body { margin: 0; font-family: system-ui, sans-serif; height: 100vh; height: 100dvh; overflow: hidden; background-color: #0b0f19; }
    .iframe-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; color: var(--text-muted); }
    .iframe-container span.placeholder { font-size: 14px; background: rgba(255, 255, 255, 0.03); padding: 12px 20px; border-radius: 30px; border: 1px solid var(--border-glass); backdrop-filter: blur(8px); text-align: center; margin: 0 20px;}
    iframe { width: 100%; height: 100%; border: none; background: #fff; position: relative; z-index: 2;}
    .floating-controls { position: fixed; top: max(20px, env(safe-area-inset-top)); left: max(20px, env(safe-area-inset-left)); z-index: 100; display: flex; gap: 10px;}
    .float-btn { background: rgba(18, 20, 26, 0.6); border: 1px solid var(--border-glass); backdrop-filter: blur(12px); padding: 10px; border-radius: 12px; cursor: pointer; display: flex; box-shadow: 0 4px 15px rgba(0,0,0,0.3); transition: 0.3s; }
    .float-btn svg { width: 20px; height: 20px; stroke: var(--text-main); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none;}
    .float-btn:hover { background: rgba(59, 130, 246, 0.2); border-color: rgba(59, 130, 246, 0.4); transform: translateY(-2px); }
    .float-btn:hover svg { stroke: var(--primary); }
    .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(3, 7, 18, 0.6); backdrop-filter: blur(4px); z-index: 101; opacity: 0; visibility: hidden; transition: 0.3s; }
    .overlay.show { opacity: 1; visibility: visible; }
    .sidebar { position: fixed; top: 0; left: -100%; width: 85%; max-width: 320px; height: 100dvh; background: var(--bg-glass); backdrop-filter: blur(20px); border-right: 1px solid var(--border-glass); color: var(--text-main); display: flex; flex-direction: column; z-index: 102; box-shadow: var(--shadow); transition: left 0.35s; padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); box-sizing: border-box; }
    .sidebar.open { left: 0; }
    .sidebar-header { padding: 20px; display: flex; flex-direction: column; gap: 16px; border-bottom: 1px solid var(--border-glass); }
    .header-top { display: flex; justify-content: space-between; align-items: center; }
    .header-top h3 { margin: 0; font-size: 16px; }
    .close-btn { background: rgba(255,255,255,0.05); border: none; color: var(--text-muted); width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; }
    .close-btn:hover { background: rgba(255,255,255,0.1); color: #fff; }
    .btn-add { padding: 10px; border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer; color: #fff; background: var(--primary); border: none; transition: 0.2s; text-align: center;}
    .btn-add:hover { background: #2563eb; }
    .nav-list { list-style: none; padding: 12px; margin: 0; overflow-y: auto; flex: 1; }
    .nav-item { padding: 12px 14px; margin: 4px 0; border-radius: 10px; cursor: pointer; transition: 0.2s; font-size: 14px; color: var(--text-muted); display: flex; align-items: center; word-break: break-word; }
    .nav-item:hover { background: rgba(255,255,255,0.05); color: var(--text-main); }
    .nav-item.active { background: rgba(59, 130, 246, 0.15); color: var(--primary); font-weight: 600; border: 1px solid rgba(59, 130, 246, 0.2); }
    .sidebar-footer { padding: 16px 15px; border-top: 1px solid var(--border-glass); display: flex; align-items: center; justify-content: space-between; gap: 10px; background: rgba(0,0,0,0.2); box-sizing: border-box;}
    .user-info { font-size: 13px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
    .btn-logout { flex-shrink: 0; display: flex; align-items: center; gap: 6px; background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.2); color: #f87171; padding: 8px 12px; border-radius: 10px; font-size: 12px; font-weight: 600; cursor: pointer; transition: 0.2s; }
    .btn-logout svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2;}
    .btn-logout:hover { background: var(--danger); color: #fff; }
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(3, 7, 18, 0.75); backdrop-filter: blur(8px); display: none; justify-content: center; align-items: center; z-index: 105; padding: 20px; box-sizing: border-box; }
    .modal { background: #151922; border: 1px solid var(--border-glass); padding: 25px 20px; border-radius: 20px; width: 100%; max-width: 400px; box-shadow: 0 25px 50px rgba(0,0,0,0.7); color: var(--text-main); box-sizing: border-box; }
    .modal h3 { margin: 0 0 20px 0; text-align: center; font-size: 18px; }
    .modal label { display: block; margin-bottom: 6px; font-size: 12px; color: var(--text-muted); text-transform: uppercase;}
    .modal input { width: 100%; padding: 12px 14px; margin-bottom: 16px; background: rgba(255,255,255,0.04); border: 1px solid var(--border-glass); border-radius: 12px; box-sizing: border-box; color: #fff; font-size: 14px; outline: none; transition: 0.2s; }
    .modal input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15); }
    .modal-actions { display: flex; gap: 10px;}
    .btn-save, .btn-cancel { flex: 1; padding: 12px; border-radius: 12px; cursor: pointer; font-weight: 600; font-size: 14px; border: none; transition: 0.2s; }
    .btn-save { background: var(--primary); color: white; }
    .btn-cancel { background: rgba(255,255,255,0.05); color: var(--text-muted); border: 1px solid var(--border-glass); }
  </style>
</head>
<body>

  <div class="floating-controls">
    <button class="float-btn" onclick="openSidebar()" title="Mở menu"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
    <button class="float-btn" onclick="toggleFullScreen()" title="Toàn màn hình"><svg viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg></button>
  </div>

  <div class="overlay" id="pageOverlay" onclick="closeSidebar()"></div>

  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="header-top">
        <h3>Danh Sách Trang</h3>
        <button class="close-btn" onclick="closeSidebar()">✕</button>
      </div>
      <button class="btn-add" onclick="openModal()">+ Thêm Trang Mới</button>
    </div>
    
    <ul class="nav-list" id="navList">
      <li style="padding: 20px; text-align: center; color: #9ca3af; font-size: 13px;">Đang tải dữ liệu...</li>
    </ul>
    
    <div class="sidebar-footer">
      <span class="user-info" id="userDisplay">Tài khoản</span>
      <button class="btn-logout" onclick="handleLogout()">
        <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4m7 14l5-5-5-5m5 5H9"/></svg> Thoát
      </button>
    </div>
  </div>

  <div class="iframe-container">
    <span class="placeholder">Bấm vào biểu tượng ☰ để mở danh sách trang</span>
    <iframe id="contentFrame" src="" allowfullscreen style="display: none;"></iframe>
  </div>

  <div class="modal-overlay" id="addModal">
    <div class="modal">
      <h3>Thêm Trang Mới</h3>
      <label>Tên hiển thị</label>
      <input type="text" id="newName" placeholder="Nhập tên trang...">
      <label>Đường dẫn (URL)</label>
      <input type="url" id="newUrl" placeholder="https://...">
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeModal()">Hủy</button>
        <button class="btn-save" id="btnSave" onclick="saveData()">Lưu lại</button>
      </div>
    </div>
  </div>

  <script src="data.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const currentUser = localStorage.getItem("currentUser");
      if (!currentUser) return window.location.href = "index.html"; 
      
      document.getElementById("userDisplay").textContent = "👤 " + currentUser;
      openSidebar();
      
      // Khởi chạy vòng lặp ngầm
      DataManager.startBackgroundWorker((data) => {
        const pages = [];
        data.forEach(item => {
          if (item.row !== 1 && item.A && item.B) pages.push({ name: item.A, url: item.B }); 
        });
        renderNavigation(pages);
      });
    });

    function handleLogout() {
      if (confirm("Đăng xuất tài khoản?")) {
        DataManager.stopBackgroundWorker();
        DataManager.clearCache();
        window.location.href = "index.html";
      }
    }

    function toggleFullScreen() {
      const doc = document.documentElement;
      if (!document.fullscreenElement) doc.requestFullscreen?.() || doc.webkitRequestFullscreen?.();
      else document.exitFullscreen?.() || document.webkitExitFullscreen?.();
    }
    
    function openSidebar() { document.getElementById("sidebar").classList.add("open"); document.getElementById("pageOverlay").classList.add("show"); }
    function closeSidebar() { document.getElementById("sidebar").classList.remove("open"); document.getElementById("pageOverlay").classList.remove("show"); }
    function openModal() { document.getElementById("newName").value = ""; document.getElementById("newUrl").value = ""; document.getElementById("addModal").style.display = "flex"; closeSidebar(); }
    function closeModal() { document.getElementById("addModal").style.display = "none"; }

    function renderNavigation(pages) {
      const navList = document.getElementById("navList");
      const currentActive = document.querySelector(".nav-item.active")?.textContent;
      navList.innerHTML = ""; 
      
      if(pages.length === 0) return navList.innerHTML = "<li style='text-align:center;color:#9ca3af;padding:20px;'>Chưa có trang nào</li>";

      pages.forEach(page => {
        const li = document.createElement("li");
        li.className = "nav-item";
        if (page.name === currentActive) li.classList.add("active");
        li.textContent = page.name;
        li.onclick = () => {
          document.querySelectorAll(".nav-item").forEach(i => i.classList.remove("active"));
          li.classList.add("active");
          document.querySelector(".placeholder").style.display = "none";
          const iframe = document.getElementById("contentFrame");
          iframe.src = page.url; iframe.style.display = "block";
          closeSidebar();
        };
        navList.appendChild(li);
      });
    }

    async function saveData() {
      const name = document.getElementById("newName").value.trim(), url = document.getElementById("newUrl").value.trim();
      const btnSave = document.getElementById("btnSave");
      if (!name || !url) return alert("Điền đủ thông tin!");
      btnSave.textContent = "Đang lưu..."; btnSave.disabled = true;

      const res = await DataManager.add("Home", { "A": name, "B": url });
      if (res.success) { closeModal(); openSidebar(); }
      else alert("Lỗi: " + res.message);
      
      btnSave.textContent = "Lưu lại"; btnSave.disabled = false;
    }
  </script>
</body>
</html>
