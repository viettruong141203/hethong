<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gửi Email Đơn Giản</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; padding: 20px; }
        .box { background: white; max-width: 500px; margin: 0 auto; padding: 25px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; margin-top: 0; }
        input, textarea, button { width: 100%; margin-bottom: 15px; padding: 12px; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }
        textarea { height: 100px; resize: vertical; }
        button { background: #007bff; color: white; border: none; font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.3s; }
        button:hover { background: #0056b3; }
        button:disabled { background: #999; cursor: not-allowed; }
        #message { text-align: center; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>

<div class="box">
    <h2>Form Gửi Email</h2>
    
    <form id="emailForm" onsubmit="xuLyGui(event)">
        <input type="text" id="tieu_de" placeholder="Tiêu đề email" required>
        <input type="email" id="email_nhan" placeholder="Email người nhận" required>
        <input type="text" id="nguoi_gui" placeholder="Tên người gửi (Ví dụ: Công ty ABC)" required>
        <input type="email" id="tra_loi" placeholder="Email nhận phản hồi" required>
        
        <textarea id="noi_dung" placeholder="Nội dung email (Hỗ trợ HTML)..." required></textarea>
        
        <button type="submit" id="btnSubmit">Gửi Thông Tin</button>
    </form>

    <div id="message"></div>
</div>

<!-- NHẬP FILE JS (Controller) VÀO HTML -->
<script src="Bot/email.js"></script>

<script>
    // Hàm này chỉ làm nhiệm vụ giao tiếp giữa Form và file email.js
    async function xuLyGui(event) {
        event.preventDefault(); // Ngăn trình duyệt reload
        
        const btn = document.getElementById('btnSubmit');
        const msg = document.getElementById('message');
        
        // 1. Thu thập dữ liệu từ các ô nhập
        const t = document.getElementById('tieu_de').value;
        const e = document.getElementById('email_nhan').value;
        const g = document.getElementById('nguoi_gui').value;
        const l = document.getElementById('tra_loi').value;
        const n = document.getElementById('noi_dung').value;

        // 2. Thay đổi trạng thái nút bấm
        btn.disabled = true;
        btn.innerText = "Đang gửi...";
        msg.innerText = "";

        // 3. ĐẨY DỮ LIỆU ĐÓ SANG CHO FILE Bot/email.js XỬ LÝ
        // Gọi hàm receiveDataAndSend() đã được định nghĩa trong email.js
        const thanhCong = await receiveDataAndSend(t, e, g, l, n);

        // 4. Nhận kết quả từ email.js trả về và báo cho người dùng
        if (thanhCong) {
            msg.style.color = "green";
            msg.innerText = "✅ Đã gửi email thành công!";
            // document.getElementById('emailForm').reset(); // Mở comment dòng này nếu muốn gửi xong thì xóa trắng form
        } else {
            msg.style.color = "red";
            msg.innerText = "❌ Có lỗi xảy ra trong quá trình gửi.";
        }

        // 5. Khôi phục nút bấm
        btn.disabled = false;
        btn.innerText = "Gửi Thông Tin";
    }
</script>

</body>
</html>
