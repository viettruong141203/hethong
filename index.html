<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hóa Đơn Thanh Toán</title>
    <style>
        :root { --vcb-color: #006633; --bg-color: #f3f4f6; --text-muted: #6b7280; --border: #e5e7eb; }
        body { font-family: Arial, sans-serif; background: var(--bg-color); margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .bill-card { background: white; width: 100%; max-width: 400px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); overflow: hidden; display: none; }
        .header { background: var(--vcb-color); color: white; text-align: center; padding: 20px; font-size: 20px; font-weight: bold; }
        .amount-section { text-align: center; padding: 20px; border-bottom: 1px dashed var(--border); }
        .amount-val { font-size: 32px; font-weight: bold; color: var(--vcb-color); margin-top: 5px; }
        .details { padding: 20px; font-size: 14px; }
        .row { display: flex; justify-content: space-between; margin-bottom: 15px; }
        .row-val { font-weight: bold; text-align: right; word-break: break-all; padding-left: 10px; }
        .qr-section { text-align: center; padding: 0 20px 20px; }
        .qr-img { width: 200px; height: 200px; border: 1px solid var(--border); border-radius: 8px; padding: 10px; }
        .status-badge { padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; background: #fef3c7; color: #d97706; }
        .status-success { background: #d1fae5; color: #059669; }
        #message-box { text-align: center; padding: 40px 20px; background: white; border-radius: 12px; width: 100%; max-width: 400px; }
    </style>
</head>
<body>

    <div id="message-box">Đang tải dữ liệu đơn hàng...</div>

    <div class="bill-card" id="bill-card">
        <div class="header">THÔNG TIN THANH TOÁN</div>
        <div class="amount-section">
            <span style="color: var(--text-muted); font-size: 14px;">Số tiền cần thanh toán</span>
            <div class="amount-val" id="bill-amount">0 đ</div>
        </div>
        <div class="details">
            <div class="row">
                <span style="color: var(--text-muted)">Ngân hàng</span>
                <span class="row-val" style="color: var(--vcb-color)">Vietcombank</span>
            </div>
            <div class="row">
                <span style="color: var(--text-muted)">Chủ tài khoản</span>
                <span class="row-val">DINH VIET TRUONG</span>
            </div>
            <div class="row">
                <span style="color: var(--text-muted)">Số tài khoản</span>
                <span class="row-val">TGE60603130946VCB</span>
            </div>
            <div class="row">
                <span style="color: var(--text-muted)">Nội dung chuyển khoản</span>
                <span class="row-val" id="bill-content">---</span>
            </div>
            <hr style="border:0; border-top: 1px dashed var(--border); margin: 15px 0;">
            <div class="row">
                <span style="color: var(--text-muted)">Mã giao dịch</span>
                <span class="row-val" id="bill-id">---</span>
            </div>
            <div class="row">
                <span style="color: var(--text-muted)">Thời gian tạo</span>
                <span class="row-val" id="bill-time" style="font-weight: normal;">---</span>
            </div>
            <div class="row">
                <span style="color: var(--text-muted)">Trạng thái</span>
                <span class="status-badge" id="bill-status">---</span>
            </div>
        </div>
        <div class="qr-section">
            <img id="qr-img" class="qr-img" src="" alt="Mã QR" style="display:none;">
            <p style="font-size: 13px; color: var(--text-muted); margin-top:10px;">Quét mã bằng ứng dụng ngân hàng</p>
        </div>
    </div>

    <!-- Nhúng file API từ GitHub của bạn -->
    <script src="https://viettruong141203.github.io/hethong/Bot/payment.js"></script>

    <script>
        const formatMoney = (amount) => new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(amount);

        document.addEventListener("DOMContentLoaded", () => {
            const urlParams = new URLSearchParams(window.location.search);
            const orderId = urlParams.get('id');
            const msgBox = document.getElementById('message-box');
            const billCard = document.getElementById('bill-card');

            if (!orderId) {
                msgBox.innerHTML = '<b style="color:red;">Lỗi: Không tìm thấy ID đơn hàng trên URL (?id=...)</b>';
                return;
            }

            if (typeof PaymentAPI !== 'undefined') {
                PaymentAPI.get(orderId).then(response => {
                    if (response.success && response.data) {
                        msgBox.style.display = 'none';
                        billCard.style.display = 'block';

                        const data = response.data;
                        
                        // Map dữ liệu mới: amount, content, id, time, status
                        document.getElementById('bill-amount').innerText = formatMoney(data.amount);
                        document.getElementById('bill-content').innerText = data.content;
                        document.getElementById('bill-id').innerText = data.id;
                        document.getElementById('bill-time').innerText = data.time;
                        
                        const statusEl = document.getElementById('bill-status');
                        statusEl.innerText = data.status;
                        if (data.status.toLowerCase().includes('đã thanh toán') || data.status.toLowerCase().includes('thành công')) {
                            statusEl.classList.remove('status-badge');
                            statusEl.classList.add('status-success', 'status-badge');
                        }

                        // Generate QR
                        const qrUrl = `https://img.vietqr.io/image/VCB-TGE60603130946VCB-compact2.png?amount=${data.amount}&addInfo=${data.content}&accountName=DINH VIET TRUONG`;
                        const qrImg = document.getElementById('qr-img');
                        qrImg.src = qrUrl;
                        qrImg.style.display = 'inline-block';

                    } else {
                        msgBox.innerHTML = `<b style="color:red;">Không tìm thấy dữ liệu cho mã đơn: ${orderId}</b><br><br><pre style="text-align:left;">${JSON.stringify(response, null, 2)}</pre>`;
                    }
                }).catch(err => {
                    msgBox.innerHTML = `<b style="color:red;">Lỗi kết nối API: ${err.message}</b>`;
                });
            } else {
                msgBox.innerHTML = '<b style="color:red;">Lỗi: Không tải được payment.js</b>';
            }
        });
    </script>
</body>
</html>
