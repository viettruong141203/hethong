<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi Tiết Đơn Hàng</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        #result { margin-top: 15px; padding: 10px; background: #f4f4f4; border-radius: 5px; }
        pre { white-space: pre-wrap; word-wrap: break-word; }
    </style>
</head>
<body>

    <h2>Tra cứu đơn hàng</h2>
    <p>ID trên URL: <strong id="display-id">Đang đọc...</strong></p>
    
    <div id="result">Vui lòng chờ...</div>

    <!-- 1. Nhúng file payment.js từ GitHub -->
    <!-- Nếu file HTML này nằm cùng thư mục Bot với payment.js, chỉ cần ghi src="payment.js" -->
    <!-- Nếu ở file/thư mục khác, dùng đường dẫn tuyệt đối: -->
    <script src="https://viettruong141203.github.io/hethong/Bot/payment.js"></script>

    <!-- 2. Logic lấy ID và gọi hàm từ payment.js -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // Lấy id từ URL (vd: ?id=261110123456)
            const urlParams = new URLSearchParams(window.location.search);
            const orderId = urlParams.get('id');
            
            const displayId = document.getElementById('display-id');
            const resultDiv = document.getElementById('result');

            if (orderId) {
                displayId.innerText = orderId;
                
                // Kiểm tra xem script payment.js đã load thành công PaymentAPI chưa
                if (typeof PaymentAPI !== 'undefined') {
                    // Gọi hàm get(id) từ class trong file payment.js
                    PaymentAPI.get(orderId)
                        .then(data => {
                            resultDiv.innerHTML = `
                                <b style="color: green;">Thành công!</b>
                                <pre>${JSON.stringify(data, null, 4)}</pre>
                            `;
                        })
                        .catch(error => {
                            resultDiv.innerHTML = `<b style="color: red;">Lỗi gọi API: ${error.message}</b>`;
                        });
                } else {
                    resultDiv.innerHTML = `<b style="color: red;">Lỗi: Không tải được file payment.js</b>`;
                }
            } else {
                displayId.innerText = "Không tìm thấy";
                resultDiv.innerHTML = "<b>Vui lòng thêm ?id=... vào cuối URL.</b>";
            }
        });
    </script>

</body>
</html>
