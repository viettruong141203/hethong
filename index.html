<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Đăng Nhập Hệ Thống</title>
  <style>
    :root { --bg-glass: rgba(18, 20, 26, 0.75); --border-glass: rgba(255, 255, 255, 0.1); --primary: #3b82f6; --text-muted: #9ca3af; }
    body { margin: 0; font-family: system-ui, sans-serif; min-height: 100vh; display: flex; justify-content: center; align-items: center; background: #0b0f19; padding: 20px; box-sizing: border-box; }
    body::before, body::after { content: ''; position: fixed; width: 50vw; height: 50vw; border-radius: 50%; filter: blur(80px); z-index: 0; opacity: 0.5; }
    body::before { background: #3b82f6; top: -10%; left: -10%; } body::after { background: #8b5cf6; bottom: -10%; right: -10%; }
    .auth-card { position: relative; z-index: 1; background: var(--bg-glass); backdrop-filter: blur(20px); border: 1px solid var(--border-glass); padding: 40px 30px; border-radius: 24px; width: 100%; max-width: 380px; box-shadow: 0 25px 50px rgba(0,0,0,0.7); color: #fff; box-sizing: border-box;}
    h3 { text-align: center; margin: 0 0 8px 0; font-size: 24px; }
    p { text-align: center; color: var(--text-muted); font-size: 13px; margin: 0 0 25px 0;}
    label { display: block; margin-bottom: 8px; font-size: 12px; color: var(--text-muted); text-transform: uppercase;}
    input { width: 100%; padding: 14px; margin-bottom: 18px; background: rgba(255,255,255,0.04); border: 1px solid var(--border-glass); border-radius: 14px; box-sizing: border-box; color: #fff; font-size: 14px; outline: none; transition: 0.2s;}
    input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(59,130,246,0.15); }
    button { width: 100%; padding: 14px; background: var(--primary); color: #fff; border: none; border-radius: 14px; cursor: pointer; font-weight: 600; font-size: 15px; transition: 0.2s;}
    button:hover { background: #2563eb; }
    .auth-switch { text-align: center; margin-top: 20px; font-size: 13px; color: var(--text-muted); }
    .auth-switch a { color: var(--primary); cursor: pointer; font-weight: 600; text-decoration: none;}
  </style>
</head>
<body>
  <div class="auth-card">
    <h3 id="aTitle">Đăng Nhập</h3>
    <p id="aSub">Chào mừng bạn quay trở lại</p>
    <div id="rFields" style="display: none;"><label>Họ và Tên</label><input type="text" id="aName"></div>
    <label>E-mail (Tài khoản)</label><input type="text" id="aEmail">
    <label>Mật khẩu</label><input type="password" id="aPass">
    <button id="btnSubmit" onclick="doAuth()">Đăng Nhập</button>
    <div class="auth-switch" id="aSwitch">Chưa có tài khoản? <a onclick="toggleMode(true)">Đăng ký</a></div>
  </div>

  <script src="data.js"></script>
  <script>
    if(localStorage.getItem("currentUser")) window.location.href = "home.html";
    let isReg = false;

    function toggleMode(toReg) {
      isReg = toReg;
      document.getElementById("aTitle").textContent = isReg ? "Đăng Ký" : "Đăng Nhập";
      document.getElementById("aSub").textContent = isReg ? "Tạo tài khoản mới" : "Chào mừng quay lại";
      document.getElementById("btnSubmit").textContent = isReg ? "Đăng Ký" : "Đăng Nhập";
      document.getElementById("rFields").style.display = isReg ? "block" : "none";
      document.getElementById("aSwitch").innerHTML = isReg ? `Đã có tài khoản? <a onclick="toggleMode(false)">Đăng nhập</a>` : `Chưa có tài khoản? <a onclick="toggleMode(true)">Đăng ký</a>`;
    }

    async function doAuth() {
      const e = document.getElementById("aEmail").value.trim(), p = document.getElementById("aPass").value.trim(), n = document.getElementById("aName").value.trim();
      const btn = document.getElementById("btnSubmit");
      if(!e || !p || (isReg && !n)) return alert("Điền đủ thông tin!");
      btn.textContent = "Đang xử lý..."; btn.disabled = true;

      if (isReg) {
        const res = await DataManager.add("DSTK", { "A": e, "B": n, "C": p });
        if(res.success) { alert("Thành công!"); toggleMode(false); } else alert("Lỗi: " + res.message);
      } else {
        const data = await DataManager.get("DSTK");
        if(data) {
          const valid = data.find(r => r.A === e && (r.C === p || r.Mật_khẩu === p)) || (e === "admin" && p === "123456");
          if(valid) { localStorage.setItem("currentUser", e); window.location.href = "home.html"; }
          else alert("Sai tài khoản hoặc mật khẩu!");
        } else alert("Lỗi kết nối cơ sở dữ liệu!");
      }
      btn.textContent = isReg ? "Đăng Ký" : "Đăng Nhập"; btn.disabled = false;
    }
  </script>
</body>
</html>
