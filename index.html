<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Đăng Nhập Hệ Thống</title>
  <style>
    :root { --bg-glass: rgba(18, 20, 26, 0.75); --border-glass: rgba(255, 255, 255, 0.1); --primary: #3b82f6; --text-muted: #9ca3af; }
    body { margin: 0; font-family: system-ui, sans-serif; min-height: 100vh; display: flex; justify-content: center; align-items: center; background: #0b0f19; padding: 20px; box-sizing: border-box; }
    body::before, body::after { content: ''; position: fixed; width: 50vw; height: 50vw; border-radius: 50%; filter: blur(80px); z-index: 0; opacity: 0.5; }
    body::before { background: #3b82f6; top: -10%; left: -10%; } body::after { background: #8b5cf6; bottom: -10%; right: -10%; }
    .auth-card { position: relative; z-index: 1; background: var(--bg-glass); backdrop-filter: blur(20px); border: 1px solid var(--border-glass); padding: 40px 30px; border-radius: 24px; width: 100%; max-width: 380px; box-shadow: 0 25px 50px rgba(0,0,0,0.7); color: #fff; box-sizing: border-box;}
    h3 { text-align: center; margin: 0 0 8px 0; font-size: 24px; }
    p { text-align: center; color: var(--text-muted); font-size: 13px; margin: 0 0 25px 0;}
    .input-group { position: relative; margin-bottom: 18px; }
    label { display: block; margin-bottom: 8px; font-size: 12px; color: var(--text-muted); text-transform: uppercase;}
    input { width: 100%; padding: 14px; background: rgba(255,255,255,0.04); border: 1px solid var(--border-glass); border-radius: 14px; box-sizing: border-box; color: #fff; font-size: 14px; outline: none; transition: 0.2s;}
    input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(59,130,246,0.15); }
    .toggle-pass { position: absolute; right: 14px; top: 38px; cursor: pointer; color: var(--text-muted); font-size: 12px; font-weight: 600; user-select: none; }
    .toggle-pass:hover { color: #fff; }
    button { width: 100%; padding: 14px; background: var(--primary); color: #fff; border: none; border-radius: 14px; cursor: pointer; font-weight: 600; font-size: 15px; transition: 0.2s;}
    button:hover:not(:disabled) { background: #2563eb; }
    button:disabled { opacity: 0.7; cursor: not-allowed; }
    .auth-switch { text-align: center; margin-top: 20px; font-size: 13px; color: var(--text-muted); }
    .auth-switch a { color: var(--primary); cursor: pointer; font-weight: 600; text-decoration: none;}
  </style>
</head>
<body>
  <div class="auth-card">
    <h3 id="aTitle">Đăng Nhập</h3>
    <p id="aSub">Chào mừng bạn quay trở lại</p>
    
    <div id="rFields" style="display: none;">
      <div class="input-group">
        <label>Họ và Tên</label>
        <input type="text" id="aName" placeholder="Nhập họ tên...">
      </div>
    </div>
    
    <div class="input-group">
      <label>Tài khoản (E-mail)</label>
      <input type="text" id="aEmail" placeholder="Nhập tài khoản...">
    </div>
    
    <div class="input-group">
      <label>Mật khẩu</label>
      <input type="password" id="aPass" placeholder="Nhập mật khẩu...">
      <span class="toggle-pass" onclick="togglePassword()">HIỆN</span>
    </div>
    
    <button id="btnSubmit" onclick="doAuth()">Đăng Nhập</button>
    <div class="auth-switch" id="aSwitch">Chưa có tài khoản? <a onclick="toggleMode(true)">Đăng ký</a></div>
  </div>

  <!-- Bắt buộc phải có file data.js cùng cấp với file HTML này -->
  <script src="data.js"></script>
  
  <script>
    if(localStorage.getItem("currentUser")) window.location.href = "home.html";
    let isReg = false;

    function toggleMode(toReg) {
      isReg = toReg;
      document.getElementById("aTitle").textContent = isReg ? "Đăng Ký" : "Đăng Nhập";
      document.getElementById("aSub").textContent = isReg ? "Tạo tài khoản mới" : "Chào mừng quay lại";
      document.getElementById("btnSubmit").textContent = isReg ? "Đăng Ký" : "Đăng Nhập";
      document.getElementById("rFields").style.display = isReg ? "block" : "none";
      document.getElementById("aSwitch").innerHTML = isReg ? `Đã có tài khoản? <a onclick="toggleMode(false)">Đăng nhập</a>` : `Chưa có tài khoản? <a onclick="toggleMode(true)">Đăng ký</a>`;
      
      document.getElementById("aEmail").value = "";
      document.getElementById("aPass").value = "";
      document.getElementById("aName").value = "";
    }

    function togglePassword() {
      const passInput = document.getElementById("aPass");
      const toggleBtn = document.querySelector(".toggle-pass");
      if (passInput.type === "password") {
        passInput.type = "text";
        toggleBtn.textContent = "ẨN";
      } else {
        passInput.type = "password";
        toggleBtn.textContent = "HIỆN";
      }
    }

    async function doAuth() {
      const e = document.getElementById("aEmail").value.trim();
      const p = document.getElementById("aPass").value.trim();
      const n = document.getElementById("aName").value.trim();
      const btn = document.getElementById("btnSubmit");
      
      if(!e || !p || (isReg && !n)) return alert("Vui lòng điền đầy đủ thông tin!");
      
      btn.textContent = "Đang xử lý..."; 
      btn.disabled = true;

      try {
        if (isReg) {
          // BƯỚC 1: Đăng ký - Lấy dữ liệu về để kiểm tra trùng lặp
          const res = await DataManager.get("DSTK");
          
          // Chuẩn hóa dữ liệu để tránh lỗi nếu API trả về cục data bao bọc
          let existingData = [];
          if (Array.isArray(res)) existingData = res;
          else if (res && Array.isArray(res.data)) existingData = res.data;

          if (existingData.length > 0) {
            const isDuplicate = existingData.find(r => {
              if (Array.isArray(r)) return r[0] === e; // Nếu là mảng 2 chiều (Google Sheets raw)
              return r.A === e || r["E-mail"] === e; // Nếu là Object
            });
            
            if (isDuplicate) {
              alert("Tài khoản (E-mail) này đã tồn tại! Vui lòng chọn một tài khoản khác.");
              btn.textContent = "Đăng Ký"; 
              btn.disabled = false;
              return; 
            }
          }

          // BƯỚC 2: Thêm mới
          const addRes = await DataManager.add("DSTK", { "A": e, "B": n, "C": p, "D": "User" });
          if(addRes && (addRes.success || addRes.status === 'success' || addRes.result === 'success')) { 
            alert("Đăng ký thành công! Vui lòng đăng nhập."); 
            toggleMode(false); 
          } else {
            alert("Lỗi: " + (addRes.message || "Không thể lưu dữ liệu"));
          }

        } else {
          // BƯỚC 1: Đăng nhập
          const res = await DataManager.get("DSTK");
          
          let existingData = [];
          if (Array.isArray(res)) existingData = res;
          else if (res && Array.isArray(res.data)) existingData = res.data;

          // Hỗ trợ mặc định cho admin
          let isValid = (e === "admin" && p === "123456");

          if (!isValid && existingData.length > 0) {
            const user = existingData.find(r => {
              // Hỗ trợ đọc cả dạng Array r[0] và dạng Object r.A
              if (Array.isArray(r)) {
                return r[0] === e && r[2] === p; // r[0] là Email, r[2] là Pass
              }
              return (r.A === e || r["E-mail"] === e) && (r.C === p || r.Mật_khẩu === p || r["Mật khẩu"] === p);
            });
            if (user) isValid = true;
          }

          if(isValid) { 
            localStorage.setItem("currentUser", e); 
            // Nếu đăng nhập thành công, chuyển hướng sang home.html
            window.location.href = "home.html"; 
          } else {
            alert("Sai tài khoản hoặc mật khẩu!");
          }
        }
      } catch (error) {
        console.error("Lỗi:", error);
        alert("Lỗi kết nối cơ sở dữ liệu! Bạn hãy kiểm tra lại Internet hoặc file data.js");
      }

      // Khôi phục trạng thái nút sau khi xử lý xong
      btn.textContent = isReg ? "Đăng Ký" : "Đăng Nhập"; 
      btn.disabled = false;
    }
  </script>
</body>
</html>
