<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng Nhập & Đăng Ký - Hệ Thống</title>
  <style>
    :root {
      --bg-glass: rgba(18, 20, 26, 0.75);
      --border-glass: rgba(255, 255, 255, 0.1);
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
    }
    
    body { 
      margin: 0; 
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
      height: 100vh; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      background-color: #0b0f19;
      overflow: hidden;
      position: relative;
    }

    /* Hiệu ứng đốm sáng nền lung linh */
    body::before, body::after {
      content: '';
      position: absolute;
      width: 350px;
      height: 350px;
      border-radius: 50%;
      filter: blur(80px);
      z-index: 0;
      opacity: 0.5;
    }
    body::before {
      background: #3b82f6;
      top: -100px;
      left: -100px;
    }
    body::after {
      background: #8b5cf6;
      bottom: -100px;
      right: -100px;
    }

    /* Form kính mờ (Glassmorphism) */
    .auth-card { 
      position: relative;
      z-index: 1;
      background: var(--bg-glass); 
      backdrop-filter: blur(20px); 
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border-glass); 
      padding: 40px 35px; 
      border-radius: 24px; 
      width: 90%; 
      max-width: 400px; 
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7); 
      color: var(--text-main);
      animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .auth-header {
      text-align: center;
      margin-bottom: 28px;
    }
    .auth-header h3 { 
      margin: 0 0 8px 0; 
      color: #fff; 
      font-size: 24px; 
      font-weight: 700; 
      letter-spacing: -0.5px; 
    }
    .auth-header p {
      margin: 0;
      color: var(--text-muted);
      font-size: 13px;
    }

    .input-group {
      margin-bottom: 18px;
    }
    .auth-card label { 
      display: block; 
      margin-bottom: 8px; 
      font-weight: 500; 
      color: var(--text-muted); 
      font-size: 12px; 
      text-transform: uppercase; 
      letter-spacing: 0.8px;
    }
    .auth-card input { 
      width: 100%; 
      padding: 14px 18px; 
      background: rgba(255, 255, 255, 0.04); 
      border: 1px solid var(--border-glass); 
      border-radius: 14px; 
      box-sizing: border-box; 
      font-size: 14px; 
      color: #fff; 
      outline: none; 
      transition: all 0.25s ease; 
    }
    .auth-card input:focus { 
      border-color: var(--primary); 
      background: rgba(59, 130, 246, 0.05);
      box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15); 
    }
    
    .btn-submit { 
      width: 100%; 
      padding: 14px; 
      background: var(--primary); 
      color: white; 
      border: none; 
      border-radius: 14px; 
      cursor: pointer; 
      font-weight: 600; 
      font-size: 15px; 
      transition: all 0.25s ease; 
      margin-top: 10px;
      box-shadow: 0 4px 15px rgba(59, 130, 246, 0.35);
    }
    .btn-submit:hover { 
      background: var(--primary-hover); 
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(59, 130, 246, 0.5);
    }
    
    .auth-switch { 
      text-align: center; 
      margin-top: 22px; 
      font-size: 13px; 
      color: var(--text-muted); 
    }
    .auth-switch a { 
      color: var(--primary); 
      cursor: pointer; 
      text-decoration: none; 
      font-weight: 600; 
      transition: color 0.2s;
    }
    .auth-switch a:hover { color: #60a5fa; text-decoration: underline; }
  </style>
</head>
<body>

  <div class="auth-card">
    <div class="auth-header">
      <h3 id="authTitle">Đăng Nhập</h3>
      <p id="authSubtitle">Chào mừng bạn quay trở lại hệ thống</p>
    </div>
    
    <div id="registerFields" class="input-group" style="display: none;">
      <label>Họ và Tên</label>
      <input type="text" id="authFullname" placeholder="Nhập họ và tên của bạn...">
    </div>

    <div class="input-group">
      <label>E-mail tài khoản</label>
      <input type="text" id="authEmail" placeholder="name@example.com">
    </div>
    
    <div class="input-group">
      <label>Mật khẩu</label>
      <input type="password" id="authPassword" placeholder="••••••••">
    </div>
    
    <button class="btn-submit" id="authSubmitBtn" onclick="submitAuth()">Đăng Nhập</button>
    
    <div class="auth-switch" id="authSwitchText">
      Chưa có tài khoản? <a onclick="switchAuthMode('register')">Đăng ký ngay</a>
    </div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzU2-uP0jUUia8w74BBQ7U78OUn3d_SE7cEd_LBZJbq2b2g4HCJyFRAOLKMU9p2zb0F/exec"; 

    let isRegisterMode = false;

    // Nếu đã đăng nhập trước đó, tự động đá sang home.html
    if (localStorage.getItem("currentUser")) {
      window.location.href = "home.html";
    }

    function switchAuthMode(mode) {
      isRegisterMode = (mode === 'register');
      const title = document.getElementById("authTitle");
      const subtitle = document.getElementById("authSubtitle");
      const btn = document.getElementById("authSubmitBtn");
      const switchText = document.getElementById("authSwitchText");
      const registerFields = document.getElementById("registerFields");

      if (isRegisterMode) {
        title.textContent = "Tạo Tài Khoản";
        subtitle.textContent = "Điền thông tin để đăng ký hệ thống mới";
        btn.textContent = "Đăng Ký";
        registerFields.style.display = "block";
        switchText.innerHTML = `Đã có tài khoản? <a onclick="switchAuthMode('login')">Đăng nhập</a>`;
      } else {
        title.textContent = "Đăng Nhập";
        subtitle.textContent = "Chào mừng bạn quay trở lại hệ thống";
        btn.textContent = "Đăng Nhập";
        registerFields.style.display = "none";
        switchText.innerHTML = `Chưa có tài khoản? <a onclick="switchAuthMode('register')">Đăng ký ngay</a>`;
      }
    }

    async function submitAuth() {
      const email = document.getElementById("authEmail").value.trim();
      const password = document.getElementById("authPassword").value.trim();
      const fullname = document.getElementById("authFullname").value.trim();
      const btn = document.getElementById("authSubmitBtn");

      if (!email || !password || (isRegisterMode && !fullname)) {
        alert("Vui lòng điền đầy đủ thông tin bắt buộc!");
        return;
      }

      btn.textContent = "Đang xử lý...";
      btn.disabled = true;

      try {
        if (isRegisterMode) {
          const payload = {
            "sheet": "DSTK",
            "action": "add",
            "A": email,
            "B": fullname,
            "C": password
          };

          const response = await fetch(SCRIPT_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify(payload),
            redirect: "follow"
          });
          const result = await response.json();
          if (result.status === "success") {
            alert("Đăng ký tài khoản thành công!");
            switchAuthMode('login');
          } else {
            alert("Lỗi đăng ký: " + (result.message || "Không xác định"));
          }
        } else {
          const payload = {
            "sheet": "DSTK",
            "action": "get"
          };

          const response = await fetch(SCRIPT_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify(payload),
            redirect: "follow"
          });
          const data = await response.json();

          if (data.status === "success" && data.all_data) {
            let isValid = false;
            data.all_data.forEach(row => {
              if (row.A === email && (row.C === password || row.Mật_khẩu === password)) {
                isValid = true;
              }
            });

            if (isValid || (email === "admin" && password === "123456")) {
              localStorage.setItem("currentUser", email);
              window.location.href = "home.html";
            } else {
              alert("Sai E-mail hoặc Mật khẩu!");
            }
          } else {
            alert("Không thể kết nối đến cơ sở dữ liệu tài khoản!");
          }
        }
      } catch (err) {
        alert("Lỗi kết nối hệ thống xác thực!");
      } finally {
        btn.textContent = isRegisterMode ? "Đăng Ký" : "Đăng Nhập";
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
