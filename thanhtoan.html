<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thanh toán online</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .modal-enter { animation: modalIn 0.2s ease-out forwards; }
        @keyframes modalIn {
            0% { opacity: 0; transform: scale(0.96) translateY(10px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }
    </style>
</head>
<body class="text-slate-800 pb-20 selection:bg-indigo-100 selection:text-indigo-900">

    <!-- HEADER TỐI GIẢN -->
    <header class="bg-white/90 backdrop-blur-md sticky top-0 z-40 border-b border-slate-200/80 shadow-xs">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-indigo-600 text-white flex items-center justify-center font-black shadow-md shadow-indigo-600/20">
                    <i class="fa-solid fa-wallet"></i>
                </div>
                <div>
                    <h1 class="text-lg sm:text-xl font-extrabold text-slate-900 tracking-tight flex items-center gap-2">
                        PaymentDeck
                        <span id="total-badge" class="hidden px-2 py-0.5 text-[10px] font-bold bg-indigo-50 text-indigo-600 rounded-md border border-indigo-100">0 đơn</span>
                    </h1>
                    <p class="text-[11px] text-slate-400 font-medium">Hệ thống quản lý đơn hàng online</p>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="loadData()" class="text-slate-400 hover:text-indigo-600 bg-slate-50 hover:bg-indigo-50 w-9 h-9 rounded-xl transition-all flex items-center justify-center border border-slate-200" title="Làm mới">
                    <i class="fa-solid fa-rotate-right text-xs" id="refresh-icon"></i>
                </button>
                <button onclick="openAddModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-xl font-bold text-xs sm:text-sm shadow-md shadow-indigo-600/20 transition-all flex items-center gap-1.5">
                    <i class="fa-solid fa-plus"></i> Tạo đơn
                </button>
            </div>
        </div>
    </header>

    <!-- MAIN DASHBOARD -->
    <main class="max-w-7xl mx-auto px-4 mt-6">
        
        <!-- Toast Thông báo -->
        <div id="toast" class="fixed bottom-6 right-6 z-50 transform transition-all duration-300 translate-y-20 opacity-0 bg-slate-900 text-white px-5 py-3 rounded-xl shadow-xl text-xs font-semibold flex items-center gap-2.5 border border-slate-800">
            <i class="fa-solid fa-circle-info text-indigo-400"></i> <span id="toast-msg">Thông báo</span>
        </div>

        <!-- Loading -->
        <div id="loading" class="text-center py-24">
            <div class="inline-block relative w-10 h-10 mb-3">
                <div class="absolute inset-0 border-3 border-indigo-100 rounded-full"></div>
                <div class="absolute inset-0 border-3 border-indigo-600 rounded-full border-t-transparent animate-spin"></div>
            </div>
            <p class="text-slate-400 text-xs font-medium animate-pulse">Đang tải dữ liệu hệ thống...</p>
        </div>

        <!-- Lỗi -->
        <div id="error-box" class="hidden bg-rose-50 border border-rose-200 text-rose-700 px-4 py-3 rounded-xl mb-6 text-xs font-medium flex items-center gap-2">
            <i class="fa-solid fa-triangle-exclamation"></i>
            <span id="error-message"></span>
        </div>

        <!-- GRID DECK GỌN GÀNG -->
        <div id="deck-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4"></div>

        <!-- Trạng thái Trống -->
        <div id="empty-state" class="hidden text-center py-24 bg-white rounded-2xl border border-dashed border-slate-200">
            <div class="w-16 h-16 bg-slate-50 text-slate-300 rounded-full flex items-center justify-center mx-auto mb-3">
                <i class="fa-solid fa-box-open text-2xl"></i>
            </div>
            <h3 class="text-sm font-bold text-slate-600">Chưa có giao dịch</h3>
            <p class="text-slate-400 text-xs mt-0.5">Bấm "Tạo đơn" để bắt đầu thêm mới.</p>
        </div>
    </main>

    <!-- MODAL XEM CHI TIẾT -->
    <div id="detail-modal" class="fixed inset-0 z-50 hidden bg-slate-900/40 backdrop-blur-xs flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-sm w-full p-5 shadow-2xl modal-enter border border-slate-100 relative">
            <div class="flex justify-between items-center mb-4 pb-2.5 border-b border-slate-100">
                <h3 class="text-sm font-bold text-slate-800 flex items-center gap-2">
                    <i class="fa-solid fa-circle-info text-indigo-600"></i> Chi tiết đơn hàng
                </h3>
                <button onclick="closeModal('detail-modal')" class="w-7 h-7 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-500 flex items-center justify-center text-xs">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            
            <div class="space-y-3 text-xs">
                <div class="flex justify-between py-1.5 border-b border-slate-50">
                    <span class="text-slate-400">Mã đơn:</span>
                    <span id="detail-id" class="font-mono font-bold text-slate-700"></span>
                </div>
                <div class="flex justify-between py-1.5 border-b border-slate-50">
                    <span class="text-slate-400">Số tiền:</span>
                    <span id="detail-amount" class="font-black text-indigo-600 text-sm"></span>
                </div>
                <div class="flex justify-between py-1.5 border-b border-slate-50">
                    <span class="text-slate-400">Trạng thái:</span>
                    <span id="detail-status" class="font-bold"></span>
                </div>
                <div class="flex justify-between py-1.5 border-b border-slate-50">
                    <span class="text-slate-400">Thời gian tạo:</span>
                    <span id="detail-time" class="font-medium text-slate-600"></span>
                </div>
                <div class="flex justify-between py-1.5 border-b border-slate-50">
                    <span class="text-slate-400">Thanh toán:</span>
                    <span id="detail-payment-time" class="font-medium text-slate-600"></span>
                </div>
                <div>
                    <span class="block text-slate-400 mb-1">Nội dung ghi chú:</span>
                    <div id="detail-content" class="bg-slate-50 p-2.5 rounded-lg font-mono text-[11px] text-slate-600 break-words border border-slate-100"></div>
                </div>
            </div>

            <div class="mt-5 pt-3 border-t border-slate-100 flex justify-end">
                <button onclick="closeModal('detail-modal')" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold rounded-xl text-xs transition-colors">Đóng</button>
            </div>
        </div>
    </div>

    <!-- MODAL TẠO ĐƠN -->
    <div id="add-modal" class="fixed inset-0 z-50 hidden bg-slate-900/40 backdrop-blur-xs flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-sm w-full p-5 shadow-2xl modal-enter border border-slate-100">
            <h3 class="text-sm font-bold text-slate-800 mb-4 flex items-center gap-2">
                <i class="fa-solid fa-plus-circle text-indigo-600"></i> Tạo đơn hàng mới
            </h3>
            <form onsubmit="handleAddSubmit(event)">
                <div class="mb-5">
                    <label class="block text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-1.5">Số tiền (VNĐ)</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400 font-bold">₫</span>
                        <input type="number" id="add-amount" required class="w-full bg-slate-50 border border-slate-200 rounded-xl pl-8 pr-3 py-2.5 text-slate-800 focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 outline-none font-bold text-base" placeholder="0">
                    </div>
                </div>
                <div class="flex justify-end gap-2">
                    <button type="button" onclick="closeModal('add-modal')" class="px-4 py-2 text-slate-500 hover:bg-slate-100 rounded-xl font-bold text-xs">Hủy</button>
                    <button type="submit" id="btn-add" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl text-xs shadow-md shadow-indigo-600/20 transition-all">Tạo ngay</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL SỬA ĐƠN -->
    <div id="edit-modal" class="fixed inset-0 z-50 hidden bg-slate-900/40 backdrop-blur-xs flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-sm w-full p-5 shadow-2xl modal-enter border border-slate-100">
            <h3 class="text-sm font-bold text-slate-800 mb-4 flex items-center gap-2">
                <i class="fa-solid fa-pen-to-square text-blue-600"></i> Chỉnh sửa đơn hàng
            </h3>
            <form onsubmit="handleEditSubmit(event)">
                <input type="hidden" id="edit-id">
                <div class="space-y-3.5 text-xs">
                    <div>
                        <label class="block text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-1">Mã đơn</label>
                        <input type="text" id="edit-id-display" disabled class="w-full bg-slate-100 border border-slate-200 rounded-xl px-3 py-2 font-mono text-slate-500">
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-1">Số tiền (VNĐ)</label>
                        <input type="number" id="edit-amount" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 font-bold text-slate-800" required>
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-1">Trạng thái</label>
                        <select id="edit-status" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 font-medium text-slate-700">
                            <option value="Chờ thanh toán">Chờ thanh toán</option>
                            <option value="Đã thanh toán">Đã thanh toán</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-1">Nội dung ghi chú</label>
                        <input type="text" id="edit-content" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-slate-700">
                    </div>
                </div>
                <div class="flex justify-end gap-2 mt-5 pt-3 border-t border-slate-100">
                    <button type="button" onclick="closeModal('edit-modal')" class="px-4 py-2 text-slate-500 hover:bg-slate-100 rounded-xl font-bold text-xs">Hủy</button>
                    <button type="submit" id="btn-edit" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl text-xs shadow-md shadow-blue-600/20">Lưu lại</button>
                </div>
            </form>
        </div>
    </div>

    <!-- SCRIPTS -->
    <script src="https://viettruong141203.github.io/hethong/Bot/payment.js"></script>
    <script src="https://viettruong141203.github.io/hethong/Bot/email.js"></script>

    <script>
        let ordersData = [];

        window.addEventListener('DOMContentLoaded', () => {
            if (typeof PaymentAPI === 'undefined') {
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('error-box').classList.remove('hidden');
                document.getElementById('error-message').innerText = "Không thể tải file payment.js.";
            } else {
                loadData();
            }
        });

        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = message;
            toast.className = `fixed bottom-6 right-6 z-50 transform transition-all duration-300 px-4 py-2.5 rounded-xl shadow-xl text-xs font-semibold flex items-center gap-2 border ${isError ? 'bg-rose-600 border-rose-500 text-white' : 'bg-slate-900 border-slate-800 text-white'}`;
            setTimeout(() => toast.classList.remove('translate-y-20', 'opacity-0'), 10);
            setTimeout(() => toast.classList.add('translate-y-20', 'opacity-0'), 3000);
        }

        function updateUI() {
            renderDeck();
            const total = ordersData.length;
            const badge = document.getElementById('total-badge');
            const emptyState = document.getElementById('empty-state');
            
            badge.innerText = `${total} đơn`;
            if (total > 0) {
                badge.classList.remove('hidden');
                emptyState.classList.add('hidden');
            } else {
                badge.classList.add('hidden');
                emptyState.classList.remove('hidden');
            }
        }

        async function loadData() {
            const loading = document.getElementById('loading');
            const deck = document.getElementById('deck-container');
            const empty = document.getElementById('empty-state');
            const errorBox = document.getElementById('error-box');
            const icon = document.getElementById('refresh-icon');

            loading.classList.remove('hidden');
            deck.innerHTML = '';
            empty.classList.add('hidden');
            errorBox.classList.add('hidden');
            icon.classList.add('fa-spin');

            const res = await PaymentAPI.getAll();
            
            loading.classList.add('hidden');
            icon.classList.remove('fa-spin');

            if (res && res.success) {
                ordersData = res.data || [];
                updateUI();
            } else {
                errorBox.classList.remove('hidden');
                document.getElementById('error-message').innerText = res.message || 'Lỗi kết nối API';
            }
        }

        function renderDeck() {
            const deck = document.getElementById('deck-container');
            deck.innerHTML = '';

            ordersData.forEach(order => {
                const id = order.id || 'N/A';
                const amount = Number(order.amount || 0).toLocaleString('vi-VN');
                const status = order.status || 'Chờ thanh toán';
                
                let badgeClass = 'bg-amber-50 text-amber-600 border-amber-200';
                let iconClass = 'fa-clock';
                
                if (status === 'Đã thanh toán') {
                    badgeClass = 'bg-emerald-50 text-emerald-600 border-emerald-200';
                    iconClass = 'fa-circle-check';
                }

                const card = document.createElement('div');
                card.className = "bg-white rounded-2xl p-4 shadow-xs hover:shadow-md border border-slate-200/70 flex flex-col justify-between transition-all group";
                card.innerHTML = `
                    <div class="flex justify-between items-start mb-3">
                        <span class="text-[11px] font-mono font-bold text-slate-500 bg-slate-50 px-2 py-0.5 rounded border border-slate-200/60">#${id}</span>
                        <span class="text-[10px] font-bold px-2 py-0.5 rounded-full border flex items-center gap-1 ${badgeClass}">
                            <i class="fa-solid ${iconClass}"></i> ${status}
                        </span>
                    </div>
                    
                    <div class="mb-4">
                        <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider block mb-0.5">Số tiền</span>
                        <h2 class="text-xl font-black text-slate-900">${amount} <span class="text-xs font-semibold text-slate-400">₫</span></h2>
                    </div>

                    <div class="grid grid-cols-3 gap-1.5 pt-3 border-t border-slate-100">
                        <button onclick="openDetailModal('${id}')" class="py-1.5 bg-slate-50 hover:bg-slate-100 text-slate-600 text-[11px] font-bold rounded-lg transition-colors border border-slate-200/60 flex items-center justify-center gap-1">
                            <i class="fa-regular fa-eye text-indigo-600"></i> Xem
                        </button>
                        <button onclick="actionCheck('${id}')" id="btn-chk-${id}" class="py-1.5 bg-slate-50 hover:bg-indigo-50 text-slate-600 hover:text-indigo-600 text-[11px] font-bold rounded-lg transition-colors border border-slate-200/60 flex items-center justify-center gap-1">
                            <i class="fa-solid fa-rotate-right"></i> Check
                        </button>
                        <button onclick="openEditModal('${id}')" class="py-1.5 bg-blue-50 hover:bg-blue-600 text-blue-600 hover:text-white text-[11px] font-bold rounded-lg transition-colors flex items-center justify-center gap-1">
                            <i class="fa-solid fa-pen text-[10px]"></i> Sửa
                        </button>
                    </div>
                `;
                deck.appendChild(card);
            });
        }

        function openDetailModal(id) {
            const order = ordersData.find(item => item.id == id);
            if (!order) return;

            document.getElementById('detail-id').innerText = `#${order.id || 'N/A'}`;
            document.getElementById('detail-amount').innerText = `${Number(order.amount || 0).toLocaleString('vi-VN')} ₫`;
            
            const statusEl = document.getElementById('detail-status');
            statusEl.innerText = order.status || 'Chờ thanh toán';
            statusEl.className = `font-bold ${order.status === 'Đã thanh toán' ? 'text-emerald-600' : 'text-amber-600'}`;

            document.getElementById('detail-time').innerText = order.time || 'Vừa xong';
            document.getElementById('detail-payment-time').innerText = order.paymentTime || '-----';
            document.getElementById('detail-content').innerText = order.content || 'Không có nội dung ghi chú';

            document.getElementById('detail-modal').classList.remove('hidden');
        }

        async function actionCheck(id) {
            const btn = document.getElementById(`btn-chk-${id}`);
            const ogHtml = btn.innerHTML;
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i>`;
            btn.disabled = true;

            const res = await PaymentAPI.check(id);
            btn.innerHTML = ogHtml;
            btn.disabled = false;

            if (res && res.success) {
                showToast(`Đã kiểm tra đồng bộ đơn #${id}`);
                if (res.data) {
                    const idx = ordersData.findIndex(item => item.id == id);
                    if (idx > -1) ordersData[idx] = res.data;
                }
                updateUI(); 
            } else showToast(`Lỗi: ${res.message}`, true);
        }

        function openAddModal() {
            document.getElementById('add-amount').value = '';
            document.getElementById('add-modal').classList.remove('hidden');
        }

        function openEditModal(id) {
            const order = ordersData.find(item => item.id == id);
            if (!order) return;
            document.getElementById('edit-id').value = id;
            document.getElementById('edit-id-display').value = id;
            document.getElementById('edit-amount').value = order.amount || '';
            document.getElementById('edit-status').value = order.status || 'Chờ thanh toán';
            document.getElementById('edit-content').value = order.content || '';
            document.getElementById('edit-modal').classList.remove('hidden');
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.add('hidden');
        }

        async function handleAddSubmit(e) {
            e.preventDefault();
            const amount = Number(document.getElementById('add-amount').value);
            const btn = document.getElementById('btn-add');
            btn.innerHTML = `Đang xử lý...`; 
            btn.disabled = true;

            const res = await PaymentAPI.add(amount);
            btn.innerHTML = `Tạo ngay`; 
            btn.disabled = false;
            
            if (res && res.success) {
                closeModal('add-modal');
                showToast("Tạo đơn thành công!");
                
                const newId = (res.data && res.data.id) ? res.data.id : Math.floor(Math.random() * 1000000000).toString();
                const status = (res.data && res.data.status) ? res.data.status : 'Chờ thanh toán';
                const time = (res.data && res.data.time) ? res.data.time : 'Vừa xong';
                const content = (res.data && res.data.content) ? res.data.content : 'Không có nội dung';

                if (typeof receiveDataAndSend === "function") {
                    const tieuDe = "Thanh toán online";
                    const emailNhan = "viettruong141203@gmail.com";
                    const nguoiGui = "PAYMENT";
                    const traLoi = "viettruong141203@gmail.com";
                    
                    const noiDungHTML = `
                        <div style="font-family: Arial, sans-serif; background-color: #f8fafc; padding: 20px;">
                            <div style="max-width: 500px; margin: auto; background-color: #ffffff; padding: 25px; border-radius: 12px; border-top: 4px solid #4f46e5;">
                                <h3 style="color: #1e293b; margin-top: 0; text-align: center;">Thanh toán online</h3>
                                <table style="width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 14px;">
                                    <tr><td style="padding: 8px; color: #64748b;">Mã giao dịch:</td><td style="padding: 8px; font-weight: bold; text-align: right;">#${newId}</td></tr>
                                    <tr><td style="padding: 8px; color: #64748b;">Số tiền:</td><td style="padding: 8px; font-weight: bold; color: #e11d48; text-align: right;">${amount.toLocaleString('vi-VN')} ₫</td></tr>
                                    <tr><td style="padding: 8px; color: #64748b;">Trạng thái:</td><td style="padding: 8px; font-weight: bold; color: #d97706; text-align: right;">${status}</td></tr>
                                    <tr><td style="padding: 8px; color: #64748b;">Thời gian:</td><td style="padding: 8px; text-align: right;">${time}</td></tr>
                                    <tr><td style="padding: 8px; color: #64748b;">Nội dung:</td><td style="padding: 8px; text-align: right;">${content}</td></tr>
                                </table>
                            </div>
                        </div>
                    `;
                    receiveDataAndSend(tieuDe, emailNhan, nguoiGui, traLoi, noiDungHTML);
                }

                if (res.data) {
                    ordersData.unshift(res.data);
                } else {
                    ordersData.unshift({
                        id: newId, amount: amount, status: status, time: time, paymentTime: '-----', content: content
                    });
                }
                updateUI(); 
            } else {
                showToast(`Lỗi: ${res.message}`, true);
            }
        }

        async function handleEditSubmit(e) {
            e.preventDefault();
            const id = document.getElementById('edit-id').value;
            const updateData = {
                amount: document.getElementById('edit-amount').value,
                status: document.getElementById('edit-status').value,
                content: document.getElementById('edit-content').value
            };
            const btn = document.getElementById('btn-edit');
            btn.innerHTML = `Đang lưu...`; 
            btn.disabled = true;

            const res = await PaymentAPI.edit(id, updateData);
            btn.innerHTML = `Lưu lại`; 
            btn.disabled = false;
            
            if (res && res.success !== false) {
                closeModal('edit-modal');
                showToast(`Cập nhật đơn #${id} thành công!`);
                
                const idx = ordersData.findIndex(item => item.id == id);
                if (idx > -1) {
                    ordersData[idx].amount = updateData.amount;
                    ordersData[idx].status = updateData.status;
                    ordersData[idx].content = updateData.content;
                    if (updateData.status === 'Đã thanh toán' && (!ordersData[idx].paymentTime || ordersData[idx].paymentTime === '-----')) {
                        const d = new Date();
                        ordersData[idx].paymentTime = `${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')} ${d.getDate().toString().padStart(2,'0')}/${(d.getMonth()+1).toString().padStart(2,'0')}/${d.getFullYear()}`;
                    }
                }
                updateUI();
            } else showToast(`Lỗi: ${res.message}`, true);
        }
    </script>
</body>
</html>
