<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Bảng Dữ Liệu Trực Tiếp</title>
  <style>
    :root { --bg-glass: rgba(18, 20, 26, 0.85); --border-glass: rgba(255, 255, 255, 0.1); --primary: #3b82f6; --text-main: #f3f4f6; --text-muted: #9ca3af; --table-border: rgba(255, 255, 255, 0.05); }
    body { margin: 0; font-family: system-ui, sans-serif; min-height: 100vh; background: #0b0f19; color: var(--text-main); padding: 20px; box-sizing: border-box; }
    body::before, body::after { content: ''; position: fixed; width: 400px; height: 400px; border-radius: 50%; filter: blur(100px); z-index: -1; opacity: 0.3; }
    body::before { background: #3b82f6; top: -10%; left: -10%; } body::after { background: #8b5cf6; bottom: -10%; right: -10%; }
    .container { max-width: 1200px; margin: 0 auto; background: var(--bg-glass); backdrop-filter: blur(20px); border: 1px solid var(--border-glass); border-radius: 20px; padding: 25px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.7); }
    .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-glass); padding-bottom: 20px; margin-bottom: 25px; }
    .header h2 { margin: 0; font-size: 20px; display: flex; align-items: center; gap: 10px;}
    .status-dot { width: 12px; height: 12px; background: #10b981; border-radius: 50%; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%, 100% { transform: scale(0.95); opacity: 0.8; } 50% { transform: scale(1.1); opacity: 1; } }
    .sheet-section { margin-bottom: 40px; }
    .sheet-title { font-size: 16px; color: var(--primary); font-weight: 700; margin-bottom: 15px; border-bottom: 2px solid var(--primary); display: inline-block; padding-bottom: 5px;}
    .table-container { width: 100%; overflow-x: auto; background: rgba(0,0,0,0.2); border-radius: 12px; border: 1px solid var(--table-border); }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { padding: 12px 16px; border-bottom: 1px solid var(--table-border); white-space: nowrap; text-align: left; }
    th { background: rgba(255,255,255,0.05); text-transform: uppercase; font-size: 12px; }
    tr:hover { background: rgba(255,255,255,0.03); }
    .truncate { max-width: 250px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: inline-block; vertical-align: middle;}
    .empty-state { text-align: center; color: var(--text-muted); font-style: italic; padding: 40px; background: rgba(0,0,0,0.2); border-radius: 12px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h2><span class="status-dot"></span> Bảng Dữ Liệu Trực Tiếp</h2>
    </div>
    <div id="dataDashboard"><div class="empty-state">Đang nạp dữ liệu...</div></div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => { renderAllData(); setInterval(renderAllData, 2000); });
    
    function renderAllData() {
      const dashboard = document.getElementById("dataDashboard");
      let html = "", hasData = false;
      
      ["Home", "Face ID", "Ngân hàng"].forEach(sheet => {
        const raw = localStorage.getItem("app_data_" + sheet);
        if (raw) {
          try {
            const data = JSON.parse(raw);
            if (Array.isArray(data) && data.length > 0) {
              hasData = true;
              html += `<div class="sheet-section"><div class="sheet-title">📁 Dữ liệu: ${sheet}</div><div class="table-container"><table><thead><tr>`;
              
              const headers = Object.keys(data[0]);
              headers.forEach(h => html += `<th>${h}</th>`);
              html += `</tr></thead><tbody>`;
              
              data.forEach(row => {
                html += `<tr>`;
                headers.forEach(k => {
                  let v = row[k] ?? "";
                  html += `<td>${(typeof v === 'string' && v.length > 60) ? `<span class="truncate" title="${v}">${v}</span>` : v}</td>`;
                });
                html += `</tr>`;
              });
              
              html += `</tbody></table></div></div>`;
            }
          } catch(e) {}
        }
      });
      
      if (hasData) { 
        if (dashboard.innerHTML !== html) dashboard.innerHTML = html; 
      } else {
        dashboard.innerHTML = `<div class="empty-state">Chưa có dữ liệu. Vui lòng mở Trang Chủ (home.html) để hệ thống tự động tải từ API về.</div>`;
      }
    }
  </script>
</body>
</html>
