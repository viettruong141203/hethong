<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trình Giám Sát Bộ Não (Data.js)</title>
  <style>
    :root {
      --bg-glass: rgba(18, 20, 26, 0.85);
      --border-glass: rgba(255, 255, 255, 0.1);
      --primary: #3b82f6;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --table-border: rgba(255, 255, 255, 0.05);
    }
    
    body { 
      margin: 0; font-family: system-ui, sans-serif; min-height: 100vh; 
      background: #0b0f19; color: var(--text-main); padding: 20px; 
    }
    
    body::before, body::after {
      content: ''; position: fixed; width: 400px; height: 400px;
      border-radius: 50%; filter: blur(100px); z-index: -1; opacity: 0.3;
    }
    body::before { background: #3b82f6; top: -10%; left: -10%; }
    body::after { background: #8b5cf6; bottom: -10%; right: -10%; }

    .container {
      max-width: 1200px; margin: 0 auto; background: var(--bg-glass);
      backdrop-filter: blur(20px); border: 1px solid var(--border-glass);
      border-radius: 20px; padding: 25px; box-shadow: 0 25px 50px rgba(0,0,0,0.5);
    }

    .header { 
      display: flex; justify-content: space-between; align-items: center; 
      border-bottom: 1px solid var(--border-glass); padding-bottom: 20px; margin-bottom: 25px; 
    }
    
    .header h2 { margin: 0; font-size: 20px; display: flex; align-items: center; gap: 10px; }
    .status-dot { width: 12px; height: 12px; background: #10b981; border-radius: 50%; animation: pulse 1s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 0.5; transform: scale(0.9); } 50% { opacity: 1; transform: scale(1.1); } }

    .sheet-card {
      background: rgba(0, 0, 0, 0.3); border: 1px solid var(--table-border);
      border-radius: 12px; padding: 20px; margin-bottom: 20px;
    }

    .sheet-title { font-size: 16px; color: var(--primary); font-weight: bold; margin-bottom: 15px; text-transform: uppercase; }

    /* Hiển thị dạng bảng */
    .table-container { width: 100%; overflow-x: auto; margin-bottom: 15px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { padding: 10px; border-bottom: 1px solid var(--table-border); text-align: left; white-space: nowrap; }
    th { background: rgba(255,255,255,0.05); color: #fff; }
    tr:hover { background: rgba(255,255,255,0.02); }
    .truncate { max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: inline-block; vertical-align: bottom;}

    /* Hiển thị dạng JSON gốc */
    .raw-data {
      background: #000; color: #a7f3d0; padding: 15px; border-radius: 8px;
      font-family: monospace; font-size: 12px; max-height: 150px; overflow-y: auto;
      border: 1px solid rgba(255,255,255,0.05); white-space: pre-wrap; word-break: break-all;
    }

    .empty-state { text-align: center; color: var(--text-muted); font-style: italic; padding: 30px; }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h2><span class="status-dot"></span> Đang giám sát bộ nhớ máy tính (LocalStorage)</h2>
      <span style="font-size: 13px; color: var(--text-muted);">Tự động quét: 1 giây/lần</span>
    </div>

    <div id="dashboard">
      <div class="empty-state">Đang nạp dữ liệu từ bộ não...</div>
    </div>
  </div>

  <script>
    // Tự động quét bộ nhớ mỗi 1 giây để bắt kịp tốc độ của data.js
    document.addEventListener("DOMContentLoaded", () => {
      readBrainData();
      setInterval(readBrainData, 1000);
    });

    function readBrainData() {
      const dashboard = document.getElementById("dashboard");
      const sheets = ["Home", "Face ID", "Ngân hàng"];
      let htmlContent = "";
      let hasData = false;

      // Đọc thông tin người dùng đang đăng nhập
      const currentUser = localStorage.getItem("currentUser");
      if (currentUser) {
        htmlContent += `
          <div class="sheet-card" style="border-color: #f59e0b;">
            <div class="sheet-title" style="color: #f59e0b;">👤 Tài khoản đang hoạt động</div>
            <div class="raw-data">${currentUser}</div>
          </div>
        `;
        hasData = true;
      }

      // Đọc dữ liệu các bảng do data.js mang về
      sheets.forEach(sheet => {
        const rawJson = localStorage.getItem("app_data_" + sheet);
        if (rawJson) {
          hasData = true;
          try {
            const dataArray = JSON.parse(rawJson);
            
            htmlContent += `<div class="sheet-card">
                              <div class="sheet-title">📂 BẢNG: ${sheet}</div>`;
            
            // Vẽ bảng
            if (Array.isArray(dataArray) && dataArray.length > 0) {
              htmlContent += `<div class="table-container"><table><thead><tr>`;
              const headers = Object.keys(dataArray[0]);
              headers.forEach(h => htmlContent += `<th>${h}</th>`);
              htmlContent += `</tr></thead><tbody>`;
              
              dataArray.forEach(row => {
                htmlContent += `<tr>`;
                headers.forEach(k => {
                  let val = row[k] ?? "";
                  // Rút gọn nếu chuỗi quá dài
                  htmlContent += `<td>${(typeof val === 'string' && val.length > 50) ? `<span class="truncate" title="${val}">${val}</span>` : val}</td>`;
                });
                htmlContent += `</tr>`;
              });
              htmlContent += `</tbody></table></div>`;
            }

            // Hiển thị mã JSON thô ở bên dưới để kiểm tra
            htmlContent += `<div class="sheet-title" style="font-size:12px; margin-top:15px; color:#9ca3af;">Dữ liệu JSON thô:</div>
                            <div class="raw-data">${JSON.stringify(dataArray, null, 2)}</div>
                          </div>`;
          } catch (e) {
            console.error("Lỗi phân tích JSON sheet " + sheet);
          }
        }
      });

      if (hasData) {
        // Chỉ vẽ lại nếu dữ liệu có thay đổi (chống giật màn hình)
        if (dashboard.innerHTML !== htmlContent) {
          dashboard.innerHTML = htmlContent;
        }
      } else {
        dashboard.innerHTML = `<div class="empty-state">Chưa có dữ liệu nào trong máy.<br>Hãy mở trang <b>home.html</b> để bộ não (data.js) bắt đầu gọi API và cất dữ liệu vào đây.</div>`;
      }
    }
  </script>
</body>
</html>
