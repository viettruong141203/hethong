<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Bảng Dữ Liệu Từ API</title>
  <style>
    :root {
      --bg-glass: rgba(18, 20, 26, 0.85);
      --border-glass: rgba(255, 255, 255, 0.1);
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --table-border: rgba(255, 255, 255, 0.05);
    }
    
    body { 
      margin: 0; 
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
      min-height: 100vh; 
      background-color: #0b0f19;
      color: var(--text-main);
      padding: 20px;
      box-sizing: border-box;
      position: relative;
    }

    /* Đốm sáng nền */
    body::before, body::after {
      content: ''; position: fixed; width: 400px; height: 400px;
      border-radius: 50%; filter: blur(100px); z-index: -1; opacity: 0.3;
    }
    body::before { background: #3b82f6; top: -10%; left: -10%; }
    body::after { background: #8b5cf6; bottom: -10%; right: -10%; }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      background: var(--bg-glass);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border-glass);
      border-radius: 20px;
      padding: 25px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    }

    .header { 
      display: flex; justify-content: space-between; align-items: center; 
      border-bottom: 1px solid var(--border-glass); padding-bottom: 20px; margin-bottom: 25px; 
      flex-wrap: wrap; gap: 10px;
    }
    .header h2 { margin: 0; font-size: 22px; color: #fff; display: flex; align-items: center; gap: 10px;}
    
    /* Chấm xanh nhấp nháy báo hiệu đang đọc dữ liệu */
    .status-dot { width: 12px; height: 12px; background: #10b981; border-radius: 50%; box-shadow: 0 0 10px #10b981; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0% { transform: scale(0.95); opacity: 0.8; } 50% { transform: scale(1.1); opacity: 1; } 100% { transform: scale(0.95); opacity: 0.8; } }

    .btn-refresh { 
      background: var(--primary); color: #fff; padding: 10px 20px; 
      border-radius: 10px; border: none; font-size: 14px; font-weight: 600; 
      cursor: pointer; transition: 0.2s;
    }
    .btn-refresh:hover { background: var(--primary-hover); transform: translateY(-2px); }

    .sheet-section { margin-bottom: 40px; }
    .sheet-title { 
      font-size: 18px; color: var(--primary); font-weight: 700; 
      margin-bottom: 15px; display: inline-block; 
      padding-bottom: 5px; border-bottom: 2px solid var(--primary);
    }

    /* Bảng hiển thị dữ liệu */
    .table-container {
      width: 100%; overflow-x: auto;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 12px; border: 1px solid var(--table-border);
    }
    
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 14px; }
    th, td { padding: 12px 16px; border-bottom: 1px solid var(--table-border); white-space: nowrap;}
    th { background: rgba(255, 255, 255, 0.05); color: #fff; font-weight: 600; text-transform: uppercase; font-size: 12px;}
    tr:last-child td { border-bottom: none; }
    tr:hover { background: rgba(255, 255, 255, 0.03); }

    .empty-state { text-align: center; color: var(--text-muted); font-style: italic; padding: 40px; font-size: 14px; background: rgba(0,0,0,0.2); border-radius: 12px; }
    
    /* Thu gọn cột chứa mã dài (như mảng Face ID) */
    .truncate { max-width: 250px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: inline-block; vertical-align: middle;}
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h2><span class="status-dot"></span> Bảng Dữ Liệu Trực Tiếp</h2>
      <button class="btn-refresh" onclick="renderAllData()">↻ Làm mới bảng</button>
    </div>

    <!-- Nơi chứa các bảng tự động vẽ -->
    <div id="dataDashboard">
      <div class="empty-state">Đang nạp dữ liệu từ bộ nhớ...</div>
    </div>
  </div>

  <script>
    // Tự động quét bộ nhớ 2 giây/lần để vẽ lại bảng nếu có dữ liệu mới
    document.addEventListener("DOMContentLoaded", () => {
      renderAllData();
      setInterval(renderAllData, 2000); 
    });

    function renderAllData() {
      const dashboard = document.getElementById("dataDashboard");
      
      // Các sheet muốn hiển thị
      const targetSheets = ["Home", "Ngân hàng", "Face ID"];
      let hasData = false;
      
      // Tạo một biến chứa toàn bộ HTML mới để tránh màn hình bị giật khi cập nhật
      let newHtmlContent = "";

      targetSheets.forEach(sheet => {
        const rawData = localStorage.getItem("app_data_" + sheet);
        
        if (rawData) {
          try {
            const parsedData = JSON.parse(rawData);
            if (Array.isArray(parsedData) && parsedData.length > 0) {
              hasData = true;
              newHtmlContent += createTableHTML(sheet, parsedData);
            }
          } catch (e) {
            console.error(`Lỗi đọc dữ liệu sheet ${sheet}`);
          }
        }
      });

      if (hasData) {
        // Chỉ cập nhật DOM nếu nội dung có sự thay đổi để tránh giật lag thanh cuộn
        if (dashboard.innerHTML !== newHtmlContent) {
          dashboard.innerHTML = newHtmlContent;
        }
      } else {
        dashboard.innerHTML = `<div class="empty-state">Chưa có dữ liệu. Vui lòng mở Trang Chủ (home.html) để hệ thống tự động tải dữ liệu từ API về máy.</div>`;
      }
    }

    // Hàm tạo HTML cho bảng
    function createTableHTML(sheetName, dataArray) {
      let html = `<div class="sheet-section">
                    <div class="sheet-title">📁 Dữ liệu: ${sheetName}</div>
                    <div class="table-container">
                      <table>
                        <thead><tr>`;
      
      // Lấy tiêu đề cột từ dòng đầu tiên
      const headers = Object.keys(dataArray[0]);
      headers.forEach(headerText => {
        html += `<th>${headerText}</th>`;
      });
      
      html += `</tr></thead><tbody>`;

      // Điền dữ liệu từng dòng
      dataArray.forEach(rowItem => {
        html += `<tr>`;
        headers.forEach(key => {
          let cellValue = rowItem[key] !== undefined && rowItem[key] !== null ? rowItem[key] : "";
          
          // Rút gọn nếu nội dung quá dài (Ví dụ: Chuỗi Vector)
          if (typeof cellValue === 'string' && cellValue.length > 60) {
            html += `<td><span class="truncate" title="${cellValue}">${cellValue}</span></td>`;
          } else {
            html += `<td>${cellValue}</td>`;
          }
        });
        html += `</tr>`;
      });

      html += `</tbody></table></div></div>`;
      return html;
    }
  </script>
</body>
</html>
