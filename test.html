<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Trình Giám Sát Dữ Liệu Offline</title>
  <style>
    :root {
      --bg-glass: rgba(18, 20, 26, 0.75);
      --border-glass: rgba(255, 255, 255, 0.1);
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --danger: #ef4444;
      --success: #10b981;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
    }
    
    body { 
      margin: 0; 
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
      min-height: 100vh; 
      background-color: #0b0f19;
      color: var(--text-main);
      padding: 20px;
      box-sizing: border-box;
      position: relative;
    }

    /* Đốm sáng nền lung linh */
    body::before, body::after {
      content: ''; position: fixed; width: 400px; height: 400px;
      border-radius: 50%; filter: blur(100px); z-index: -1; opacity: 0.4;
    }
    body::before { background: #3b82f6; top: -10%; left: -10%; }
    body::after { background: #8b5cf6; bottom: -10%; right: -10%; }

    .container {
      max-width: 900px;
      margin: 0 auto;
      background: var(--bg-glass);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border-glass);
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    }

    .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-glass); padding-bottom: 20px; margin-bottom: 20px; flex-wrap: wrap; gap: 15px;}
    .header h2 { margin: 0; font-size: 22px; display: flex; align-items: center; gap: 10px;}
    .status-dot { width: 12px; height: 12px; background: var(--success); border-radius: 50%; box-shadow: 0 0 10px var(--success); animation: pulse 1.5s infinite; }
    
    @keyframes pulse { 0% { transform: scale(0.95); opacity: 0.8; } 50% { transform: scale(1.1); opacity: 1; } 100% { transform: scale(0.95); opacity: 0.8; } }

    .btn-group { display: flex; gap: 10px; }
    .btn { 
      padding: 10px 16px; border-radius: 10px; border: none; 
      font-size: 13px; font-weight: 600; cursor: pointer; transition: 0.2s; color: #fff;
    }
    .btn-refresh { background: var(--primary); }
    .btn-refresh:hover { background: var(--primary-hover); }
    .btn-clear { background: rgba(239, 68, 68, 0.1); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }
    .btn-clear:hover { background: var(--danger); color: #fff; }

    .storage-section { margin-bottom: 30px; }
    .storage-title { font-size: 15px; color: var(--text-muted); font-weight: 500; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 1px;}
    
    .data-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-glass);
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 15px;
      transition: 0.2s;
    }
    .data-card:hover { border-color: rgba(255,255,255,0.2); transform: translateY(-2px); }
    
    .data-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .data-key { font-weight: 700; font-size: 15px; color: var(--primary); word-break: break-all;}
    .data-size { font-size: 12px; color: #fff; background: rgba(59, 130, 246, 0.2); border: 1px solid rgba(59, 130, 246, 0.4); padding: 4px 10px; border-radius: 20px;}
    
    .data-value {
      background: rgba(0,0,0,0.4);
      padding: 15px;
      border-radius: 8px;
      font-size: 13px;
      font-family: 'Courier New', Courier, monospace;
      color: #a7f3d0;
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 250px;
      overflow-y: auto;
      margin: 0;
      border: 1px solid rgba(255,255,255,0.05);
    }
    
    /* Tùy chỉnh thanh cuộn cho khu vực hiển thị code */
    .data-value::-webkit-scrollbar { width: 6px; }
    .data-value::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }

    .empty-state { text-align: center; color: var(--text-muted); font-style: italic; padding: 30px; font-size: 14px; background: rgba(0,0,0,0.2); border-radius: 12px;}
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h2><span class="status-dot"></span> Giám Sát Dữ Liệu Offline</h2>
      <div class="btn-group">
        <button class="btn btn-refresh" onclick="loadStorageData()">↻ Tải lại tức thì</button>
        <button class="btn btn-clear" onclick="clearAllStorage()">🗑 Xóa toàn bộ máy</button>
      </div>
    </div>

    <!-- Khu vực hiển thị Local Storage -->
    <div class="storage-section">
      <div class="storage-title">
        💾 Dữ Liệu Đang Được Lưu Vĩnh Viễn Trên Thiết Bị Này
      </div>
      <div id="localContainer"></div>
    </div>
  </div>

  <script>
    // Gọi hàm load dữ liệu khi trang mở
    document.addEventListener("DOMContentLoaded", () => {
      loadStorageData();
      // Tự động làm mới giao diện 1 giây/lần để bắt kịp dữ liệu ngầm từ data.js
      setInterval(loadStorageData, 1000); 
    });

    function loadStorageData() {
      const container = document.getElementById("localContainer");
      container.innerHTML = "";
      
      const storage = window.localStorage;
      
      if (storage.length === 0) {
        container.innerHTML = `<div class="empty-state">Hệ thống chưa lưu bất kỳ dữ liệu nào trên máy này.</div>`;
        return;
      }

      // Lấy danh sách các key và sắp xếp (Ưu tiên currentUser lên đầu, sau đó đến app_data)
      let keys = [];
      for (let i = 0; i < storage.length; i++) {
        keys.push(storage.key(i));
      }
      keys.sort();

      keys.forEach(key => {
        const value = storage.getItem(key);
        let displayValue = value;
        
        // Cố gắng định dạng JSON cho đẹp mắt nếu đó là dữ liệu của các sheet
        try {
          const parsed = JSON.parse(value);
          if (typeof parsed === 'object' && parsed !== null) {
            displayValue = JSON.stringify(parsed, null, 2);
          }
        } catch (e) {
          // Nếu không phải JSON thì giữ nguyên chữ thô (ví dụ: Tên tài khoản)
        }

        // Tính dung lượng tương đối của dữ liệu đó
        const sizeInBytes = new Blob([value]).size;
        let sizeDisplay = sizeInBytes + " Bytes";
        if (sizeInBytes > 1024) {
          sizeDisplay = (sizeInBytes / 1024).toFixed(2) + " KB";
        }

        // Tạo thẻ hiển thị
        const card = document.createElement("div");
        card.className = "data-card";
        
        // Đặt màu nhấn khác nhau cho tài khoản và dữ liệu bảng
        let keyColorStyle = key === "currentUser" ? "color: #f59e0b;" : "";

        card.innerHTML = `
          <div class="data-header">
            <span class="data-key" style="${keyColorStyle}">${key}</span>
            <span class="data-size">${sizeDisplay}</span>
          </div>
          <pre class="data-value">${displayValue}</pre>
        `;
        container.appendChild(card);
      });
    }

    function clearAllStorage() {
      if(confirm("⚠ CẢNH BÁO: Thao tác này sẽ xóa sạch toàn bộ danh sách Web, dữ liệu Face ID, Ngân hàng và Tài khoản đăng nhập trên máy này.\n\nBạn có chắc chắn muốn xóa không?")) {
        localStorage.clear();
        sessionStorage.clear();
        loadStorageData();
        alert("Đã dọn dẹp sạch sẽ toàn bộ hệ thống!");
      }
    }
  </script>
</body>
</html>
