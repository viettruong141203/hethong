<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Giám Sát Bộ Nhớ</title>
  <style>
    :root { --bg-glass: rgba(18, 20, 26, 0.75); --border-glass: rgba(255, 255, 255, 0.1); --primary: #3b82f6; --danger: #ef4444; --text-main: #f3f4f6; }
    body { margin: 0; font-family: system-ui, sans-serif; min-height: 100vh; background: #0b0f19; color: var(--text-main); padding: 20px; box-sizing: border-box; }
    .container { max-width: 900px; margin: 0 auto; background: var(--bg-glass); backdrop-filter: blur(20px); border: 1px solid var(--border-glass); border-radius: 20px; padding: 30px; }
    .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-glass); padding-bottom: 20px; margin-bottom: 20px; }
    .header h2 { margin: 0; font-size: 20px;}
    .btn-clear { background: rgba(239, 68, 68, 0.1); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); padding: 10px 16px; border-radius: 10px; cursor: pointer; font-weight:600;}
    .data-card { background: rgba(255,255,255,0.03); border: 1px solid var(--border-glass); border-radius: 12px; padding: 15px; margin-bottom: 15px; }
    .data-header { display: flex; justify-content: space-between; margin-bottom: 12px; font-weight: bold; color: var(--primary);}
    .data-value { background: rgba(0,0,0,0.4); padding: 15px; border-radius: 8px; font-family: monospace; color: #a7f3d0; white-space: pre-wrap; word-break: break-all; max-height: 250px; overflow-y: auto; margin:0;}
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h2>💾 Dữ Liệu Local Storage</h2>
      <button class="btn-clear" onclick="clearAll()">🗑 Xóa toàn bộ</button>
    </div>
    <div id="localContainer"></div>
  </div>
  <script>
    document.addEventListener("DOMContentLoaded", () => { loadData(); setInterval(loadData, 1000); });
    function loadData() {
      const c = document.getElementById("localContainer"), s = window.localStorage;
      if (!s.length) return c.innerHTML = "<p style='text-align:center;color:#9ca3af;'>Trống.</p>";
      let keys = []; for(let i=0; i<s.length; i++) keys.push(s.key(i)); keys.sort();
      let html = "";
      keys.forEach(k => {
        let v = s.getItem(k);
        try { const p = JSON.parse(v); if(p && typeof p === 'object') v = JSON.stringify(p, null, 2); } catch(e){}
        html += `<div class="data-card"><div class="data-header"><span style="${k==='currentUser'?'color:#f59e0b':''}">${k}</span><span>${new Blob([v]).size} Bytes</span></div><pre class="data-value">${v}</pre></div>`;
      });
      c.innerHTML = html;
    }
    function clearAll() { if(confirm("Xóa toàn bộ hệ thống?")) { localStorage.clear(); loadData(); } }
  </script>
</body>
</html>
