<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Quản Lý Dữ Liệu Hệ Thống</title>
  <style>
    :root {
      --bg-glass: rgba(18, 20, 26, 0.85);
      --border-glass: rgba(255, 255, 255, 0.1);
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --table-border: rgba(255, 255, 255, 0.05);
    }
    
    body { 
      margin: 0; 
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
      min-height: 100vh; 
      background-color: #0b0f19;
      color: var(--text-main);
      padding: 20px;
      box-sizing: border-box;
      position: relative;
    }

    body::before, body::after {
      content: ''; position: fixed; width: 400px; height: 400px;
      border-radius: 50%; filter: blur(100px); z-index: -1; opacity: 0.3;
    }
    body::before { background: #3b82f6; top: -10%; left: -10%; }
    body::after { background: #8b5cf6; bottom: -10%; right: -10%; }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      background: var(--bg-glass);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border-glass);
      border-radius: 20px;
      padding: 25px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    }

    .header { 
      display: flex; justify-content: space-between; align-items: center; 
      border-bottom: 1px solid var(--border-glass); padding-bottom: 20px; margin-bottom: 25px; 
    }
    .header h2 { margin: 0; font-size: 22px; color: #fff;}
    
    .btn-refresh { 
      background: var(--primary); color: #fff; padding: 10px 20px; 
      border-radius: 10px; border: none; font-size: 14px; font-weight: 600; 
      cursor: pointer; transition: 0.2s;
    }
    .btn-refresh:hover { background: var(--primary-hover); transform: translateY(-2px); }

    .sheet-section { margin-bottom: 40px; }
    .sheet-title { 
      font-size: 18px; color: var(--primary); font-weight: 700; 
      margin-bottom: 15px; display: inline-block; 
      padding-bottom: 5px; border-bottom: 2px solid var(--primary);
    }

    /* Định dạng bảng dữ liệu */
    .table-container {
      width: 100%;
      overflow-x: auto;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 12px;
      border: 1px solid var(--table-border);
    }
    
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 14px; }
    th, td { padding: 12px 16px; border-bottom: 1px solid var(--table-border); white-space: nowrap;}
    th { background: rgba(255, 255, 255, 0.05); color: #fff; font-weight: 600; }
    tr:last-child td { border-bottom: none; }
    tr:hover { background: rgba(255, 255, 255, 0.03); }

    .empty-state { text-align: center; color: var(--text-muted); font-style: italic; padding: 30px; font-size: 14px; }
    
    /* Thu gọn dữ liệu quá dài (như mảng Vector) */
    .truncate { max-width: 250px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: inline-block; vertical-align: middle;}
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h2>📊 Bảng Quản Trị Dữ Liệu</h2>
      <button class="btn-refresh" onclick="renderAllData()">↻ Làm mới bảng</button>
    </div>

    <div id="dataDashboard">
      <!-- Các bảng dữ liệu sẽ được Javascript tự động vẽ vào đây -->
    </div>
  </div>

  <script>
    // Khởi tạo ngay khi mở trang và lặp lại mỗi 2 giây
    document.addEventListener("DOMContentLoaded", () => {
      renderAllData();
      setInterval(renderAllData, 2000); 
    });

    function renderAllData() {
      const dashboard = document.getElementById("dataDashboard");
      dashboard.innerHTML = ""; // Xóa bảng cũ trước khi vẽ bảng mới

      // Khai báo 3 sheet cần lấy từ localStorage
      const targetSheets = ["Home", "Ngân hàng", "Face ID"];
      let hasData = false;

      targetSheets.forEach(sheet => {
        const rawData = localStorage.getItem("app_data_" + sheet);
        
        if (rawData) {
          try {
            const parsedData = JSON.parse(rawData);
            if (Array.isArray(parsedData) && parsedData.length > 0) {
              hasData = true;
              const section = createTableSection(sheet, parsedData);
              dashboard.appendChild(section);
            }
          } catch (e) {
            console.error(`Lỗi đọc dữ liệu sheet ${sheet}`);
          }
        }
      });

      if (!hasData) {
        dashboard.innerHTML = `<div class="empty-state">Chưa có dữ liệu nào được lưu trong máy. Hãy mở trang chủ để hệ thống tự động tải về.</div>`;
      }
    }

    // Hàm tạo bảng HTML tự động dựa trên các cột có trong JSON
    function createTableSection(sheetName, dataArray) {
      const section = document.createElement("div");
      section.className = "sheet-section";
      
      const title = document.createElement("div");
      title.className = "sheet-title";
      title.textContent = `📁 Dữ liệu bảng: ${sheetName}`;
      section.appendChild(title);

      const tableContainer = document.createElement("div");
      tableContainer.className = "table-container";

      const table = document.createElement("table");
      
      // Lấy danh sách tiêu đề cột từ object đầu tiên
      const headers = Object.keys(dataArray[0]);
      
      // Vẽ dòng Tiêu đề (Thead)
      const thead = document.createElement("thead");
      const headerRow = document.createElement("tr");
      headers.forEach(headerText => {
        const th = document.createElement("th");
        th.textContent = headerText;
        headerRow.appendChild(th);
      });
      thead.appendChild(headerRow);
      table.appendChild(thead);

      // Vẽ các dòng Dữ liệu (Tbody)
      const tbody = document.createElement("tbody");
      dataArray.forEach(rowItem => {
        const row = document.createElement("tr");
        
        headers.forEach(key => {
          const td = document.createElement("td");
          let cellValue = rowItem[key] !== undefined && rowItem[key] !== null ? rowItem[key] : "";
          
          // Nếu dữ liệu là chuỗi dài (như chuỗi Vector của Face ID), cắt bớt cho gọn
          if (typeof cellValue === 'string' && cellValue.length > 50) {
            td.innerHTML = `<span class="truncate" title="${cellValue}">${cellValue}</span>`;
          } else {
            td.textContent = cellValue;
          }
          
          row.appendChild(td);
        });
        tbody.appendChild(row);
      });

      table.appendChild(tbody);
      tableContainer.appendChild(table);
      section.appendChild(tableContainer);

      return section;
    }
  </script>
</body>
</html>
